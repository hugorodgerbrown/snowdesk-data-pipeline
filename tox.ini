[tox]
no_package = True
envlist =
    fmt, lint, mypy,
    django-checks,
    ds-lint,
    js-globals-lint,
    i18n-lint,
    docs-lint,
    e2e-lint,
    migrations-lint,
    test,
    js

[testenv:test]
description = Run tests with coverage
runner = uv-venv-lock-runner
dependency_groups = test
# dependency_groups implies --no-default-groups automatically (tox-uv);
# --frozen here is the load-bearing bit: fail instead of silently
# re-resolving against a stale uv.lock.
uv_sync_flags =
    --frozen
setenv =
    DJANGO_SETTINGS_MODULE = config.settings.development
    # Disable analytics during tests to prevent live event emission.
    # The Vary: Cookie / Cache-Control concern is handled in app code via the
    # _POSTHOG_EXEMPT_PATHS exemption in config/settings/base.py (SNOW-299,
    # SNOW-338) and is guarded by key-on regression tests in tests/public/
    # (test_map_api.py plus the per-surface static-route tests).
    POSTHOG_API_KEY =
commands =
    pytest -n auto --cov=apps.core --cov=apps.bulletins --cov=apps.regions --cov=apps.public --cov=apps.accounts --cov=apps.analytics --cov=apps.mcp_server --cov=apps.observations --cov=apps.favourites --cov=apps.weather --cov=config --cov=schedule tests/

[testenv:django-checks]
description = Django system checks and missing migrations
runner = uv-venv-lock-runner
dependency_groups = test
# dependency_groups implies --no-default-groups automatically (tox-uv);
# --frozen here is the load-bearing bit: fail instead of silently
# re-resolving against a stale uv.lock.
uv_sync_flags =
    --frozen
setenv =
    DJANGO_SETTINGS_MODULE = config.settings.development
    POSTHOG_API_KEY =
commands =
    python manage.py check --fail-level WARNING
    python manage.py makemigrations --dry-run --check --verbosity 3

[testenv:fmt]
description = Python source code formatting (ruff format)
# ruff's version now lives in one place — pyproject.toml's `lint` dependency
# group / uv.lock — installed here via the lock runner, kept in lockstep with
# .pre-commit-config.yaml's ruff-pre-commit rev (a floating dep here is what
# broke CI in SNOW-500). See docs/coding-standards.md §6.5.
runner = uv-venv-lock-runner
dependency_groups = lint
# dependency_groups implies --no-default-groups automatically (tox-uv);
# --frozen here is the load-bearing bit: fail instead of silently
# re-resolving against a stale uv.lock.
uv_sync_flags =
    --frozen
commands =
    ruff format --check .

[testenv:lint]
description = Python source code linting and import sorting (ruff)
# Pinned to match .pre-commit-config.yaml — see the note on [testenv:fmt].
runner = uv-venv-lock-runner
dependency_groups = lint
# dependency_groups implies --no-default-groups automatically (tox-uv);
# --frozen here is the load-bearing bit: fail instead of silently
# re-resolving against a stale uv.lock.
uv_sync_flags =
    --frozen
commands =
    ruff check .

[testenv:ds-lint]
description = Design-system linter (templates + static/js) — forbids palette/radius literals
skip_install = True
deps =
commands =
    python {toxinidir}/bin/ds-lint

[testenv:js-globals-lint]
description = Fail on reads of window/self globals nothing in static/js assigns
skip_install = True
deps =
commands =
    python {toxinidir}/bin/js-globals-lint

[testenv:i18n-lint]
description = Fail on user-facing strings hardcoded in static/js (invisible to makemessages)
skip_install = True
deps =
commands =
    python {toxinidir}/bin/i18n-lint

[testenv:docs-lint]
description = Documentation linter — frontmatter + CLAUDE.md routing for docs/
skip_install = True
deps =
commands =
    python {toxinidir}/bin/docs-lint

# SNOW-649. In the default envlist and the lint-guards CI matrix as of the
# deletion — it costs nothing to run (no browser, no server, pure AST) and
# it is the only thing standing between this suite and a third overrun.
[testenv:e2e-lint]
description = Playwright suite guard — suite-size backstop, test length, scenario mapping
skip_install = True
deps =
commands =
    python {toxinidir}/bin/e2e-lint

# SNOW-652. Deliberately NOT part of django-checks: that env needs Django,
# settings and a full app registry, while this is a filename-and-AST scan
# that runs in the dependency-free lint matrix. The split also means the
# guard still reports when django-checks itself cannot start.
[testenv:migrations-lint]
description = Fail on duplicate migration numbers or a multi-leaf migration graph
skip_install = True
deps =
commands =
    python {toxinidir}/bin/migrations-lint

[testenv:djangofmt]
description = Django template formatting check (djangofmt) — CI backstop for the bypassable pre-commit hook
runner = uv-venv-lock-runner
dependency_groups = lint
# dependency_groups implies --no-default-groups automatically (tox-uv);
# --frozen here is the load-bearing bit: fail instead of silently
# re-resolving against a stale uv.lock.
uv_sync_flags =
    --frozen
allowlist_externals = git
# djangofmt's version now lives in pyproject.toml's `lint` dependency group /
# uv.lock (and therefore .venv/bin/djangofmt, which the pre-commit hook
# invokes) — installing from the same lock keeps CI and the local hook in
# lockstep, the same failure mode SNOW-512 fixed for ruff.
# djangofmt has no --check/--diff mode (0.2.x); format in place, then fail if
# anything changed. Mirrors the pre-commit hook's exclude of _bulletin_panel.html.
# Not in the default envlist because it mutates the tree — CI invokes it via
# `tox -e djangofmt` (lint-guards.yml), and pre-commit covers the local path.
commands =
    djangofmt --extend-exclude _bulletin_panel.html \
        {toxinidir}/templates \
        {toxinidir}/apps/bulletins/templates \
        {toxinidir}/apps/public/templates \
        {toxinidir}/apps/accounts/templates \
        {toxinidir}/apps/observations/templates \
        {toxinidir}/apps/favourites/templates \
        {toxinidir}/tests/templates
    git -C {toxinidir} diff --exit-code

[testenv:audit]
# The RUNTIME gate. Deliberately scoped to --no-dev so that an advisory in a
# linter or test tool can never block a production release — see SNOW-576.
# Do not widen this env to cover dev groups; that coverage lives in
# `audit-dev` below, which is reported separately and is not a required
# status check.
description = Check for known CVEs in pinned dependencies (pip-audit)
skip_install = True
allowlist_externals = uv
deps =
    pip-audit
commands =
    uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file {envtmpdir}/requirements.txt
    pip-audit --requirement {envtmpdir}/requirements.txt

[testenv:audit-dev]
# Detection-only coverage for everything the runtime gate above cannot see:
# the dev dependency groups (104 of the 169 packages in uv.lock — the whole
# test/type/lint/sast/e2e toolchain) and the npm tree. Both are dev-only and
# neither reaches a browser, but "dev-only" is a severity judgement, and an
# audit that never runs cannot make it — that is exactly how the sharp
# advisory (SNOW-578) sat unnoticed.
#
# This env is NOT a required status check. It fails loudly on a new finding
# so it is visible, but it must never gate a merge or a release.
#
# Ignored advisories — each needs a reason and a removal condition. A bare
# ignore with no exit criterion is how a permanently-red check becomes
# background noise that nobody reads (SNOW-599).
#
#   PYSEC-2026-3481 / -3482 / -3483 — mcp 1.23.3, reachable only as a
#     transitive dependency of semgrep (`uv tree --package mcp --invert`).
#     Fixed upstream in mcp 1.27.2 / 1.28.1, but semgrep 1.172.0 (the latest
#     release, and the one this project pins) requires `mcp==1.23.3` exactly,
#     so there is no resolvable fix on our side. mcp is never imported by
#     application code or tests. REMOVE these three ignores as soon as a
#     semgrep release relaxes that pin — re-check with:
#       curl -s https://pypi.org/pypi/semgrep/json | grep -o 'mcp==[0-9.]*'
#     Added 2026-08-03 (SNOW-576).
description = Detection-only CVE scan of the dev dependency groups and the npm tree
skip_install = True
allowlist_externals =
    uv
    npm
deps =
    pip-audit
commands =
    uv export --frozen --no-emit-project --no-hashes --format requirements-txt --output-file {envtmpdir}/requirements-all.txt
    pip-audit --requirement {envtmpdir}/requirements-all.txt \
        --ignore-vuln PYSEC-2026-3481 \
        --ignore-vuln PYSEC-2026-3482 \
        --ignore-vuln PYSEC-2026-3483
    # --package-lock-only audits straight from package-lock.json, so this
    # needs neither `npm ci` nor a node_modules tree in CI.
    npm audit --package-lock-only --audit-level=low

[testenv:sast]
description = Static analysis (semgrep) — Django + Python rulesets
runner = uv-venv-lock-runner
dependency_groups = sast
# dependency_groups implies --no-default-groups automatically (tox-uv);
# --frozen here is the load-bearing bit: fail instead of silently
# re-resolving against a stale uv.lock.
uv_sync_flags =
    --frozen
skip_install = True
# The semgrep PACKAGE is pinned by the lock like every other tool (via the
# `sast` dependency group). Its RULESETS below (--config=p/…) are deliberately
# NOT pinned or vendored — they are fetched live from the Semgrep registry on
# every run. For a security scanner, a freshly-published rule is a
# newly-detected vulnerability class, so live rules are a feature: the
# residual risk (a new upstream rule turning this env red with no local diff)
# is accepted in exchange for that freshness. See
# docs/decisions/tox-envs-install-from-uv-lock.md and docs/coding-standards.md
# §6.5 — do not "finish the job" by vendoring/pinning these rulesets.
# Excluded rules (high false-positive rate on idiomatic Django code):
#   * template-blocktranslate-no-escape / template-translate-as-no-escape
#     — fire on every {% blocktrans %} / {% trans X as Y %}; mitigation
#       (|force_escape on interpolated values) doesn't satisfy the pattern.
#   * generic var-in-href — fires on every href="{{ url }}" even when the
#     value is the output of {% url 'name' %} (server-derived).
#   * logger-credential-leak — string-matches log-message wording (e.g.
#     "valid token for unknown email"); too noisy to be actionable.
#   * unvalidated-password — fires on set_password() without validate_password().
#     The only set_password() call site is the dev-only user seed (SeedModel.USER
#     in the seed_test_data command — DEBUG-gated, weak documented dev password);
#     the app's real auth is magic-link + passkey with no password forms. Revisit
#     if a password-set path is ever added to production code.
commands =
    semgrep --config=p/django --config=p/python --config=p/security-audit \
        --exclude-rule=python.django.security.audit.xss.template-blocktranslate-no-escape.template-blocktranslate-no-escape \
        --exclude-rule=python.django.security.audit.xss.template-translate-as-no-escape.template-translate-as-no-escape \
        --exclude-rule=generic.html-templates.security.var-in-href.var-in-href \
        --exclude-rule=python.lang.security.audit.logging.logger-credential-leak.python-logger-credential-disclosure \
        --exclude-rule=python.django.security.audit.unvalidated-password.unvalidated-password \
        --error --quiet \
        --exclude=.venv --exclude=node_modules --exclude=.claude \
        --exclude=migrations --exclude=tests --exclude=docs/research \
        .
    semgrep --test --config {toxinidir}/bin/semgrep/rules.yml {toxinidir}/bin/semgrep/rules.py
    semgrep --config={toxinidir}/bin/semgrep/rules.yml --error --quiet tests/

[testenv:e2e]
description = End-to-end browser tests (Playwright/Chromium) — opt-in, not in default envlist
runner = uv-venv-lock-runner
dependency_groups = e2e
# dependency_groups implies --no-default-groups automatically (tox-uv);
# --frozen here is the load-bearing bit: fail instead of silently
# re-resolving against a stale uv.lock.
uv_sync_flags =
    --frozen
setenv =
    DJANGO_SETTINGS_MODULE = config.settings.development
    # Python 3.12+ (and the Playwright async internals) may leave a running
    # event loop when pytest-django tries to create the test database, which
    # triggers Django's SynchronousOnlyOperation guard.  The live-server
    # thread is already isolated from the test thread, so relaxing this guard
    # is safe for the e2e env.
    DJANGO_ALLOW_ASYNC_UNSAFE = true
    # Disable analytics in e2e runs so PosthogContextMiddleware short-circuits
    # and never accesses request.user (same rationale as the test env).
    POSTHOG_API_KEY =
    # Use a file-based SQLite test DB (not the default in-memory shared-cache
    # one) so the live-server thread and the test thread don't hit SQLITE_LOCKED
    # table locks at teardown flush. See config/settings/development.py.
    E2E_TEST_DB = 1
    # SNOW-585: development.py defaults this to True, but
    # tests/e2e/test_pwa_lifecycle_update.py asserts the update banner and
    # pwa.sw.update_available fire — both of which the bypass suppresses.
    # Pin it off here so that suite keeps testing production semantics;
    # tests/e2e/test_pwa_dev_shell_bypass.py exercises the bypass itself via
    # its own @override_settings / monkeypatch.
    SW_DEV_SHELL_BYPASS = false
# npx is needed by commands_pre's Tailwind build (SNOW-491) — the CSS is a
# gitignored build artefact, so tox must build it rather than trust whatever
# stale copy is on disk.
allowlist_externals =
    npx
commands_pre =
    # Build the stylesheet before the live server serves statics, mirroring
    # .github/workflows/e2e.yml. static/css/output.css is a gitignored build
    # artefact; without a fresh build the e2e run uses whatever stale copy is
    # on disk, and any test that clicks a CSS-positioned control fails its
    # Playwright actionability check — e.g. SNOW-491, where the SNOW-486
    # z-index tokens (--z-popup et al.) were missing from an unrebuilt
    # output.css, so the favourite/report sheets dropped below the map utility
    # buttons (z-index:4) and "<div id=map> subtree intercepts pointer events".
    npx @tailwindcss/cli -i ./src/css/main.css -o ./static/css/output.css --minify
    # Install the Chromium binary only — no ``--with-deps``. That flag runs
    # ``apt-get`` to install system libraries on every invocation (~15-20 s on
    # a GitHub runner) and is a no-op on local macOS. The GitHub-hosted
    # ubuntu-latest image already ships Chromium's shared-library dependencies,
    # so the browser launches without it. If a future runner image drops those
    # libs, add a one-off ``playwright install-deps chromium`` step in
    # .github/workflows/e2e.yml rather than paying the apt cost every run.
    playwright install chromium
# Run the Playwright suite under pytest-xdist. Each test is already isolated:
# ``live_server`` is function-scoped and binds an ephemeral port (no port
# race), ``page`` is function-scoped (no shared browser), and pytest-django
# suffixes the test DB per worker — ``e2e_test_db.sqlite3_gw0`` etc. — so the
# fixed E2E_TEST_DB name (development.py) stays a single-server/single-thread
# arrangement per worker. LocMemCache is per-process, so no cross-worker bleed.
# Start conservative at ``-n 2`` — Chromium is memory-hungry (~0.5 GB/worker)
# and the GitHub runner is small; raise toward ``-n auto`` once this proves
# stable. (Historically this env ran ``-n0`` on the belief the tests shared one
# live server + browser session; they do not — see the fixtures above.)
# {posargs:tests/e2e/} lets `tox -e e2e -- tests/e2e/some_file.py` target a
# single file (SNOW-389 spike iteration + anti-flake loops) while defaulting
# to the full directory when no posargs are given.
# --reruns/--reruns-delay (pytest-rerunfailures, `e2e` dependency group only)
# is a bounded automatic-retry net for the real-SW/CacheStorage timing
# flakes that can't be made fully deterministic (SNOW-516). Deliberately
# NOT applied to [testenv:test] — the unit env must keep zero rerun
# behaviour so a flaky-looking unit failure is never silently retried away.
commands =
    pytest {posargs:tests/e2e/} --no-cov -n 2 --reruns 2 --reruns-delay 1

[testenv:js]
description = JS unit tests (Vitest/jsdom/fake-indexeddb) — in the default envlist
skip_install = True
allowlist_externals = npm
# In the default envlist: Vitest is fast and deterministic, so it belongs in
# the common local `tox` loop (unlike e2e/Lighthouse, which stay CI-only —
# see e2e.yml / lighthouse.yml). The one cost is the `npm ci` clean install
# below, which runs on every default `tox`; CI's dedicated `js.yml` runs the
# same env as the authoritative backstop. Not gated by a Node setup in the
# Python-only CI jobs because each of those pins TOXENV to a single env and
# never invokes the bare default envlist.
commands =
    npm ci
    npm run test:js

[testenv:mypy]
description = Python source code type hints (mypy)
runner = uv-venv-lock-runner
dependency_groups = type
# dependency_groups implies --no-default-groups automatically (tox-uv);
# --frozen here is the load-bearing bit: fail instead of silently
# re-resolving against a stale uv.lock.
uv_sync_flags =
    --frozen
setenv =
    DJANGO_SETTINGS_MODULE = config.settings.development
commands =
    mypy apps/core/ apps/bulletins/ apps/regions/ apps/public/ apps/accounts/ apps/analytics/ tests/ config/ apps/observations/ apps/favourites/ apps/mcp_server/ schedule.py
