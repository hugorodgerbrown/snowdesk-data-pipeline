[tox]
no_package = True
envlist =
    fmt, lint, mypy,
    django-checks,
    ds-lint,
    docs-lint,
    test

[testenv:test]
description = Run tests with coverage
deps =
    coverage
    pytest
    pytest-cov
    pytest-django
    pytest-xdist
    Django
    django-htmx
    django-csp-plus
    django-waffle
    python-decouple
    requests
    factory-boy
    django-ratelimit
    freezegun
    pyyaml
    bleach
    shapely
    webauthn
    defusedxml
    geoip2
    pdfplumber
    pywebpush
    py_vapid
    cryptography
    django-tasks
    django-tasks-db
    apscheduler
    posthog
    rapidfuzz
setenv =
    DJANGO_SETTINGS_MODULE = config.settings.development
    # Disable analytics during tests to prevent live event emission.
    # The Vary: Cookie / Cache-Control concern is handled in app code via the
    # _POSTHOG_EXEMPT_PATHS exemption in config/settings/base.py (SNOW-299,
    # SNOW-338) and is guarded by key-on regression tests in tests/public/
    # (test_map_api.py plus the per-surface static-route tests).
    POSTHOG_API_KEY =
commands =
    pytest -n auto --cov=core --cov=bulletins --cov=regions --cov=public --cov=accounts --cov=analytics --cov=mcp_server --cov=observations --cov=favourites --cov=config --cov=schedule tests/

[testenv:django-checks]
description = Django system checks and missing migrations
deps =
    Django
    django-htmx
    django-csp-plus
    django-waffle
    python-decouple
    requests
    django-ratelimit
    pyyaml
    bleach
    webauthn
    defusedxml
    geoip2
    pdfplumber
    pywebpush
    py_vapid
    cryptography
    django-tasks
    django-tasks-db
    apscheduler
    posthog
    rapidfuzz
setenv =
    DJANGO_SETTINGS_MODULE = config.settings.development
    POSTHOG_API_KEY =
commands =
    python manage.py check --fail-level WARNING
    python manage.py makemigrations --dry-run --check --verbosity 3

[testenv:fmt]
description = Python source code formatting (ruff format)
deps =
    ruff
commands =
    ruff format --check .

[testenv:lint]
description = Python source code linting and import sorting (ruff)
deps =
    ruff
commands =
    ruff check .

[testenv:ds-lint]
description = Design-system template linter — forbids palette/radius literals
skip_install = True
deps =
commands =
    python {toxinidir}/bin/ds-lint

[testenv:docs-lint]
description = Documentation linter — frontmatter + CLAUDE.md routing for docs/
skip_install = True
deps =
commands =
    python {toxinidir}/bin/docs-lint

[testenv:djangofmt]
description = Django template formatting check (djangofmt) — CI backstop for the bypassable pre-commit hook
skip_install = True
allowlist_externals = git
deps =
    djangofmt
# djangofmt has no --check/--diff mode (0.2.x); format in place, then fail if
# anything changed. Mirrors the pre-commit hook's exclude of _bulletin_panel.html.
# Not in the default envlist because it mutates the tree — CI invokes it via
# `tox -e djangofmt` (lint-guards.yml), and pre-commit covers the local path.
commands =
    djangofmt --extend-exclude _bulletin_panel.html \
        {toxinidir}/templates \
        {toxinidir}/bulletins/templates \
        {toxinidir}/public/templates \
        {toxinidir}/accounts/templates \
        {toxinidir}/observations/templates \
        {toxinidir}/tests/templates
    git -C {toxinidir} diff --exit-code

[testenv:audit]
description = Check for known CVEs in pinned dependencies (pip-audit)
skip_install = True
allowlist_externals = uv
deps =
    pip-audit
commands =
    uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file {envtmpdir}/requirements.txt
    pip-audit --requirement {envtmpdir}/requirements.txt

[testenv:sast]
description = Static analysis (semgrep) — Django + Python rulesets
skip_install = True
deps =
    semgrep
# Excluded rules (high false-positive rate on idiomatic Django code):
#   * template-blocktranslate-no-escape / template-translate-as-no-escape
#     — fire on every {% blocktrans %} / {% trans X as Y %}; mitigation
#       (|force_escape on interpolated values) doesn't satisfy the pattern.
#   * generic var-in-href — fires on every href="{{ url }}" even when the
#     value is the output of {% url 'name' %} (server-derived).
#   * logger-credential-leak — string-matches log-message wording (e.g.
#     "valid token for unknown email"); too noisy to be actionable.
#   * unvalidated-password — fires on set_password() without validate_password().
#     The only set_password() call site is the dev-only user seed (SeedModel.USER
#     in the seed_test_data command — DEBUG-gated, weak documented dev password);
#     the app's real auth is magic-link + passkey with no password forms. Revisit
#     if a password-set path is ever added to production code.
commands =
    semgrep --config=p/django --config=p/python --config=p/security-audit \
        --exclude-rule=python.django.security.audit.xss.template-blocktranslate-no-escape.template-blocktranslate-no-escape \
        --exclude-rule=python.django.security.audit.xss.template-translate-as-no-escape.template-translate-as-no-escape \
        --exclude-rule=generic.html-templates.security.var-in-href.var-in-href \
        --exclude-rule=python.lang.security.audit.logging.logger-credential-leak.python-logger-credential-disclosure \
        --exclude-rule=python.django.security.audit.unvalidated-password.unvalidated-password \
        --error --quiet \
        --exclude=.venv --exclude=node_modules --exclude=.claude \
        --exclude=migrations --exclude=tests --exclude=docs/research \
        .
    semgrep --test --config {toxinidir}/semgrep/rules.yml {toxinidir}/semgrep/rules.py
    semgrep --config={toxinidir}/semgrep/rules.yml --error --quiet tests/

[testenv:e2e]
description = End-to-end browser tests (Playwright/Chromium) — opt-in, not in default envlist
deps =
    coverage
    pytest
    pytest-cov
    pytest-django
    pytest-playwright>=0.7,<0.9
    pytest-xdist
    playwright>=1.0,<2.0
    Django
    django-htmx
    django-csp-plus
    django-waffle
    python-decouple
    requests
    factory-boy
    django-ratelimit
    freezegun
    pyyaml
    bleach
    shapely
    webauthn
    defusedxml
    geoip2
    pywebpush
    py_vapid
    cryptography
    django-tasks
    django-tasks-db
    apscheduler
    posthog
    rapidfuzz
setenv =
    DJANGO_SETTINGS_MODULE = config.settings.development
    # Python 3.12+ (and the Playwright async internals) may leave a running
    # event loop when pytest-django tries to create the test database, which
    # triggers Django's SynchronousOnlyOperation guard.  The live-server
    # thread is already isolated from the test thread, so relaxing this guard
    # is safe for the e2e env.
    DJANGO_ALLOW_ASYNC_UNSAFE = true
    # Disable analytics in e2e runs so PosthogContextMiddleware short-circuits
    # and never accesses request.user (same rationale as the test env).
    POSTHOG_API_KEY =
    # Use a file-based SQLite test DB (not the default in-memory shared-cache
    # one) so the live-server thread and the test thread don't hit SQLITE_LOCKED
    # table locks at teardown flush. See config/settings/development.py.
    E2E_TEST_DB = 1
# npx is needed by commands_pre's Tailwind build (SNOW-491); bash wraps the
# two-command split below so a "no tests collected" exit (5) from a
# single-file posargs target that doesn't match a given -m filter doesn't
# fail the whole env — see the commands comment.
allowlist_externals =
    npx
    bash
commands_pre =
    # Build the stylesheet before the live server serves statics, mirroring
    # .github/workflows/e2e.yml. static/css/output.css is a gitignored build
    # artefact; without a fresh build the e2e run uses whatever stale copy is
    # on disk, and any test that clicks a CSS-positioned control fails its
    # Playwright actionability check — e.g. SNOW-491, where the SNOW-486
    # z-index tokens (--z-popup et al.) were missing from an unrebuilt
    # output.css, so the favourite/report sheets dropped below the map utility
    # buttons (z-index:4) and "<div id=map> subtree intercepts pointer events".
    npx @tailwindcss/cli -i ./src/css/main.css -o ./static/css/output.css --minify
    playwright install chromium --with-deps
# SNOW-497: re-enables xdist for the SW-free set. pytest-django gives each
# xdist worker its own gwN test database and live_server binds an
# OS-assigned free port per worker, so the "races on ports and DB state"
# concern the old single -n0 comment (here until SNOW-497) raised turns out
# not to hold for the SW-free tests — verified empirically: green under
# -n auto, and faster wall-clock than the old single serial run (reported in
# the SNOW-497 PR). The real-SW modules (marked `real_sw` — see
# pyproject.toml's marker registration) still can't share a worker process
# (each drives its own live SW registration/IndexedDB against ONE browser
# context sequence) and run second, serially (-n0).
#
# {posargs:tests/e2e/} is applied to BOTH commands (not just the first) so
# single-file targeting still works in either direction: `tox -e e2e --
# tests/e2e/test_some_journey.py` runs that file against both -m filters,
# and whichever one doesn't match anything in that file collects zero tests
# (pytest exit code 5) rather than actual test output — the bash wrapper
# maps that specific "nothing collected" exit back to 0 so it doesn't fail
# the env; a real test failure (exit 1) still propagates and fails tox.
commands =
    bash -c 'pytest {posargs:tests/e2e/} -m "not real_sw" --no-cov -n auto; ec=$?; if [ $ec -eq 5 ]; then exit 0; else exit $ec; fi'
    bash -c 'pytest {posargs:tests/e2e/} -m "real_sw" --no-cov -n0; ec=$?; if [ $ec -eq 5 ]; then exit 0; else exit $ec; fi'

[testenv:js]
description = JS unit tests (Vitest/jsdom/fake-indexeddb) — opt-in, not in default envlist
skip_install = True
allowlist_externals = npm
# npm ci is a network/time cost unsuited to the common local `tox` loop —
# same rationale as the e2e env — so this stays out of the default envlist.
# Run via `tox -e js`.
commands =
    npm ci
    npm run test:js

[testenv:mypy]
description = Python source code type hints (mypy)
deps =
    mypy<2.1  # 2.1.0 crashes the django-stubs plugin loader (SNOW-356)
    Django
    django-htmx
    django-csp-plus
    django-waffle
    django-stubs
    python-decouple
    requests
    types-requests
    django-ratelimit
    factory-boy
    bleach
    types-bleach
    shapely
    webauthn
    defusedxml
    types-defusedxml
    pytest
    pytest-django
    freezegun
    geoip2
    pdfplumber
    pywebpush
    py_vapid
    cryptography
    django-tasks
    django-tasks-db
    apscheduler
    posthog
    rapidfuzz
setenv =
    DJANGO_SETTINGS_MODULE = config.settings.development
commands =
    mypy core/ bulletins/ regions/ public/ accounts/ analytics/ tests/ config/ observations/ favourites/ mcp_server/ schedule.py
