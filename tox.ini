[tox]
no_package = True
envlist =
    fmt, lint, mypy,
    django-checks,
    ds-lint,
    test

[testenv:test]
description = Run tests with coverage
deps =
    coverage
    pytest
    pytest-cov
    pytest-django
    pytest-xdist
    Django
    django-htmx
    django-csp-plus
    django-waffle
    python-decouple
    requests
    factory-boy
    django-ratelimit
    freezegun
    pyyaml
    bleach
    shapely
    webauthn
    defusedxml
    geoip2
    pdfplumber
setenv =
    DJANGO_SETTINGS_MODULE = config.settings.development
commands =
    pytest -n auto --cov=core --cov=bulletins --cov=regions --cov=public --cov=subscriptions --cov=config tests/

[testenv:django-checks]
description = Django system checks and missing migrations
deps =
    Django
    django-htmx
    django-csp-plus
    django-waffle
    python-decouple
    requests
    django-ratelimit
    pyyaml
    bleach
    webauthn
    defusedxml
    geoip2
    pdfplumber
setenv =
    DJANGO_SETTINGS_MODULE = config.settings.development
commands =
    python manage.py check --fail-level WARNING
    python manage.py makemigrations --dry-run --check --verbosity 3

[testenv:fmt]
description = Python source code formatting (ruff format)
deps =
    ruff
commands =
    ruff format --check .

[testenv:lint]
description = Python source code linting and import sorting (ruff)
deps =
    ruff
commands =
    ruff check .

[testenv:ds-lint]
description = Design-system template linter — forbids palette/radius literals
skip_install = True
deps =
commands =
    python {toxinidir}/bin/ds-lint

[testenv:audit]
description = Check for known CVEs in pinned dependencies (pip-audit)
skip_install = True
deps =
    pip-audit
    poetry
    poetry-plugin-export
commands =
    poetry export --without-hashes --format=requirements.txt --output={envtmpdir}/requirements.txt
    pip-audit --requirement {envtmpdir}/requirements.txt

[testenv:sast]
description = Static analysis (semgrep) — Django + Python rulesets
skip_install = True
deps =
    semgrep
# Excluded rules (high false-positive rate on idiomatic Django code):
#   * template-blocktranslate-no-escape / template-translate-as-no-escape
#     — fire on every {% blocktrans %} / {% trans X as Y %}; mitigation
#       (|force_escape on interpolated values) doesn't satisfy the pattern.
#   * generic var-in-href — fires on every href="{{ url }}" even when the
#     value is the output of {% url 'name' %} (server-derived).
#   * logger-credential-leak — string-matches log-message wording (e.g.
#     "valid token for unknown email"); too noisy to be actionable.
commands =
    semgrep --config=p/django --config=p/python --config=p/security-audit \
        --exclude-rule=python.django.security.audit.xss.template-blocktranslate-no-escape.template-blocktranslate-no-escape \
        --exclude-rule=python.django.security.audit.xss.template-translate-as-no-escape.template-translate-as-no-escape \
        --exclude-rule=generic.html-templates.security.var-in-href.var-in-href \
        --exclude-rule=python.lang.security.audit.logging.logger-credential-leak.python-logger-credential-disclosure \
        --error --quiet \
        --exclude=.venv --exclude=node_modules --exclude=.claude \
        --exclude=migrations --exclude=tests --exclude=docs/research \
        .

[testenv:e2e]
description = End-to-end browser tests (Playwright/Chromium) — opt-in, not in default envlist
deps =
    coverage
    pytest
    pytest-cov
    pytest-django
    pytest-playwright>=0.7,<0.8
    playwright>=1.0,<2.0
    Django
    django-htmx
    django-csp-plus
    django-waffle
    python-decouple
    requests
    factory-boy
    django-ratelimit
    freezegun
    pyyaml
    bleach
    shapely
    webauthn
    defusedxml
    geoip2
setenv =
    DJANGO_SETTINGS_MODULE = config.settings.development
    # Python 3.12+ (and the Playwright async internals) may leave a running
    # event loop when pytest-django tries to create the test database, which
    # triggers Django's SynchronousOnlyOperation guard.  The live-server
    # thread is already isolated from the test thread, so relaxing this guard
    # is safe for the e2e env.
    DJANGO_ALLOW_ASYNC_UNSAFE = true
commands_pre =
    playwright install chromium --with-deps
commands =
    pytest tests/e2e/ --no-cov

[testenv:mypy]
description = Python source code type hints (mypy)
deps =
    mypy
    Django
    django-htmx
    django-csp-plus
    django-waffle
    django-stubs
    python-decouple
    requests
    types-requests
    django-ratelimit
    factory-boy
    bleach
    types-bleach
    shapely
    webauthn
    defusedxml
    types-defusedxml
    pytest
    pytest-django
    freezegun
    geoip2
    pdfplumber
setenv =
    DJANGO_SETTINGS_MODULE = config.settings.development
commands =
    mypy core/ bulletins/ regions/ public/ subscriptions/ tests/ config/
