{% load components %}
{% comment %}
templates/includes/_button.html — Reusable button partial.

Renders either an ``<a>`` anchor or a ``<button>`` element depending on
whether ``href`` is supplied.

Context:
    label         : str  — visible button text (required).
    href          : str  — if supplied, renders an ``<a>``; otherwise a ``<button>``.
    button_type   : str  — ``type`` attribute for ``<button>`` (default ``"submit"``).
    button_id     : str  — optional ``id`` attribute. Auto-escaped.
    variant       : str  — ``"primary"`` (default), ``"secondary"``, or ``"ghost"``.
    size          : str  — ``"standard"`` (default, px-5 py-2.5) or
                           ``"compact"`` (px-4 py-2).
    full_width    : bool — when truthy, adds ``w-full`` (default False).
    extra_classes : str  — additional Tailwind classes appended after the
                           standard button classes (e.g. ``"whitespace-nowrap"``).
{% endcomment %}
{% if href %}
    <a
        href="{{ href }}"
        class="{% button_classes variant=variant size=size full_width=full_width is_anchor=True %}{% if extra_classes %} {{ extra_classes }}{% endif %}"
        {% if button_id %}id="{{ button_id }}"{% endif %}
    >{{ label }}</a>
{% else %}
    <button
        type="{{ button_type|default:'submit' }}"
        class="{% button_classes variant=variant size=size full_width=full_width %}{% if extra_classes %} {{ extra_classes }}{% endif %}"
        {% if button_id %}id="{{ button_id }}"{% endif %}
    >
        {{ label }}
    </button>
{% endif %}
