{% comment %}
templates/includes/_offline_audit_panel.html — the offline-content audit,
app side (SNOW-907).

The controls and the strings <template>; everything inside
[data-offline-audit-output] is painted by static/js/offline_audit.js, and
styled by the [data-offline-audit] block in src/css/main.css. That module
emits NO class strings — a Tailwind class would be inert on
static/offline.html, which carries the same markup contract and its own
inline styles, and which is the whole reason this panel has two hosts.
See the offline page's header comment for why it needs its own copy.

A caller must load both scripts:

    {% templatetag openblock %} static 'js/offline_audit_core.js' {% templatetag closeblock %}
    {% templatetag openblock %} static 'js/offline_audit.js' {% templatetag closeblock %}

Nothing here runs on load. The report is taken when the user asks for it:
it walks every Cache Storage bucket and opens IndexedDB, which is cheap
but not free, and a device is in no state to be doing it on every render
of a settings page nobody came here to audit.
{% endcomment %}
{% load i18n components %}

<div data-offline-audit>
    {% comment %}
        The controls, on one row. Copy appears once there is a report to
        copy and Save once the report says the map page is missing AND the
        device could do something about it — both are revealed by the
        module, not by CSS, because both conditions are readings rather
        than states of this markup.
    {% endcomment %}
    <div class="flex flex-wrap items-center gap-3">
        {% comment %}
            ``button_classes`` rather than includes/_button.html, for the
            same reason the Reset and Delete rows on the settings page use
            it: the partial takes no data-attribute passthrough (SNOW-645
            removed ``extra_attrs`` after semgrep flagged it as an
            attribute-injection surface on a reusable component), and
            ``data-offline-audit-run`` is this module's binding contract.
            The tag gives the same class string the partial would.

            SNOW-907 review: PRIMARY, not ghost. It is the only thing on
            this row that does anything before a report exists, and the
            two controls beside it are both disabled until it has run —
            a row of three equally-weighted ghosts gave no clue which one
            starts.
        {% endcomment %}
        <button
            type="button"
            data-offline-audit-run
            class="{% button_classes variant='primary' size='compact' %} whitespace-nowrap"
        >
            {% translate "Run the check" %}
        </button>
        <button
            type="button"
            data-offline-audit-copy
            hidden
            class="text-sm text-text-2 underline underline-offset-2"
        >
            {% translate "Copy report" %}
        </button>
        <button
            type="button"
            data-offline-audit-save
            hidden
            class="text-sm text-text-2 underline underline-offset-2"
        >
            {% translate "Save the map page" %}
        </button>
        <p
            class="text-sm text-text-3"
            data-offline-audit-status
            role="status"
            aria-live="polite"
        >
        </p>
    </div>

    <div class="mt-2" data-offline-audit-output hidden></div>

    {# SNOW-620: server-translated copy, read back by offline_audit.js. #}
    {# Every key here has an English literal in that module's FALLBACKS, #}
    {# which is what the offline page — where pwaStrings is not loaded — #}
    {# renders. tests/accounts/test_settings_offline_audit.py fails if #}
    {# the two key sets drift. #}
    <template id="offline-audit-strings-template">
        <span data-string="section-access">{% translate "Getting in" %}</span>
        <span data-string="section-map">{% translate "The map" %}</span>
        <span data-string="section-regions">{% translate "Regions you downloaded" %}</span>
        <span data-string="section-dropzones">{% translate "Drop zones you downloaded" %}</span>
        <span data-string="section-custom">{% translate "Areas you drew" %}</span>
        <span data-string="section-content">{% translate "Your content" %}</span>
        <span data-string="section-keeping">{% translate "Keeping it" %}</span>

        <span data-string="row-offline-mode">{% translate "Offline mode is on" %}</span>
        <span data-string="row-app-opens">{% translate "The app opens" %}</span>
        <span data-string="row-app-complete">{% translate "The app is complete" %}</span>
        <span data-string="row-danger-ratings">{% translate "Danger ratings" %}</span>
        <span data-string="row-region-shapes">{% translate "Region outlines" %}</span>
        <span data-string="row-overview">{% translate "Zoomed-out overview" %}</span>
        <span data-string="row-no-downloads">{% translate "Map areas downloaded" %}</span>
        <span data-string="row-bulletins">{% translate "Bulletins you have opened" %}</span>
        <span data-string="row-saved-places">{% translate "Your saved places" %}</span>
        <span data-string="row-reports">{% translate "Community reports" %}</span>
        <span data-string="row-weather">{% translate "Weather" %}</span>
        <span data-string="row-protected">{% translate "Safe from browser cleanup" %}</span>
        <span data-string="row-room">{% translate "Room for more" %}</span>
        <span data-string="row-unsent">{% translate "Changes you make are kept" %}</span>

        <span data-string="answer-yes">{% translate "Yes" %}</span>
        <span data-string="answer-no">{% translate "No" %}</span>
        <span data-string="answer-unknown">{% translate "—" %}</span>
        <span data-string="answer-pending">{% translate "…" %}</span>

        <span data-string="note-sw-unsupported">{% translate "this browser has no offline mode at all" %}</span>
        <span
            data-string="note-sw-starting"
        >{% translate "offline mode is starting up and will be ready on the next load" %}</span>
        <span data-string="note-sw-absent">{% translate "offline mode has not been set up on this device" %}</span>
        <span data-string="note-other-account">{% translate "the saved copy belongs to %(stamped)s" %}</span>
        <span
            data-string="note-no-areas"
        >{% translate "no map area is downloaded, so there is no ground to draw" %}</span>
        <span
            data-string="note-no-overview"
        >{% translate "zooming out past a downloaded area will show nothing" %}</span>
        <span
            data-string="note-area-incomplete"
        >{% translate "%(name)s will not draw until you repair it from the map’s Manage downloads sheet" %}</span>
        <span
            data-string="note-area-missing"
        >{% translate "%(name)s is recorded as downloaded but nothing is stored, so download it again" %}</span>
        <span
            data-string="note-area-unverifiable"
        >{% translate "%(name)s was downloaded before the app recorded what an area needs, so it cannot be checked" %}</span>
        <span data-string="note-no-bulletins">{% translate "no bulletin has been opened on this device yet" %}</span>
        <span
            data-string="note-no-favourites"
        >{% translate "none of your saved places has been loaded here yet" %}</span>
        <span
            data-string="note-no-reports"
        >{% translate "community reports have not been loaded on this device" %}</span>
        <span
            data-string="note-no-weather"
        >{% translate "the weather overlay has not been opened on this device" %}</span>
        <span
            data-string="note-not-persisted"
        >{% translate "the browser may delete downloads when space runs low, and installing Snowdesk to the home screen usually stops that" %}</span>
        <span
            data-string="note-no-room"
        >{% translate "only %(used)s of %(total)s is left, so the browser may start deleting downloads" %}</span>
        <span
            data-string="note-no-db"
        >{% translate "the local database would not open, so nothing can be saved here" %}</span>
        <span data-string="note-unsent">{% translate "%(n)s of your changes are waiting to be sent" %}</span>

        <span data-string="effect-styles">{% translate "will look plain" %}</span>
        <span data-string="effect-ratings">{% translate "will show no danger ratings" %}</span>
        <span data-string="effect-shapes">{% translate "will draw no region outlines" %}</span>
        <span data-string="group-open-map-lead">{% translate "Without a signal the app %(effects)s." %}</span>
        <span
            data-string="group-open-map-remedy"
        >{% translate "Opening the map once while connected fixes %(count)s." %}</span>

        <span data-string="principal-anonymous">{% translate "a signed-out visitor" %}</span>
        <span data-string="principal-account">{% translate "account %(id)s…" %}</span>
        <span data-string="principal-unknown">{% translate "an unknown account" %}</span>

        <span data-string="verdict-ok">{% translate "Everything you need is on this device." %}</span>
        <span data-string="verdict-no-worker">{% translate "This device is not set up for offline use yet." %}</span>
        <span
            data-string="verdict-no-page"
        >{% translate "The app will not open without a signal. Open the map once while connected." %}</span>
        <span
            data-string="verdict-other-account"
        >{% translate "The saved app belongs to another account. Open the map once while connected." %}</span>
        <span
            data-string="verdict-incomplete-app"
        >{% translate "The app would open blank without a signal. Open the map once while connected." %}</span>
        <span data-string="verdict-no-map">{% translate "The app opens, but there is no map to show in it." %}</span>
        <span
            data-string="verdict-downloads-broken"
        >{% translate "The app opens, but none of your downloads will draw." %}</span>

        <span data-string="notes-sentence">{% translate "Also worth knowing: %(notes)s." %}</span>
        <span data-string="list-pair">{% translate "%(first)s and %(last)s" %}</span>
        <span data-string="list-join">{% translate "%(first)s, %(rest)s" %}</span>
        <span data-string="count-one">{% translate "it" %}</span>
        <span data-string="count-two">{% translate "both" %}</span>
        <span data-string="count-many">{% translate "all %(n)s of them" %}</span>

        <span data-string="counts-line">{% translate "%(yes)s of %(total)s available offline" %}</span>

        <span data-string="running">{% translate "Checking…" %}</span>
        <span data-string="copied">{% translate "copied" %}</span>
        <span data-string="copy-failed">{% translate "copy failed" %}</span>
        <span data-string="saving">{% translate "Saving the app…" %}</span>
        <span data-string="saved">{% translate "Saved. Re-checking…" %}</span>
        <span data-string="save-failed">{% translate "That could not be saved. Try again while connected." %}</span>
    </template>
</div>
