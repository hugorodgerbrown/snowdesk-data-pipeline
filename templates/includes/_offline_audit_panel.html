{% comment %}
templates/includes/_offline_audit_panel.html — the offline-content audit,
app side (SNOW-907).

The controls and the strings <template>; everything inside
[data-offline-audit-output] is painted by static/js/offline_audit.js, and
styled by the [data-offline-audit] block in src/css/main.css. That module
emits NO class strings — a Tailwind class would be inert on
static/offline.html, which carries the same markup contract and its own
inline styles, and which is the whole reason this panel has two hosts.
See the offline page's header comment for why it needs its own copy.

A caller must load both scripts:

    {% templatetag openblock %} static 'js/offline_audit_core.js' {% templatetag closeblock %}
    {% templatetag openblock %} static 'js/offline_audit.js' {% templatetag closeblock %}

Nothing here runs on load. The report is taken when the user asks for it:
it walks every Cache Storage bucket and opens IndexedDB, which is cheap
but not free, and a device is in no state to be doing it on every render
of a settings page nobody came here to audit.
{% endcomment %}
{% load i18n components %}

<div data-offline-audit>
    {% comment %}
        The controls, on one row. Copy appears once there is a report to
        copy and Save once the report says the map page is missing AND the
        device could do something about it — both are revealed by the
        module, not by CSS, because both conditions are readings rather
        than states of this markup.
    {% endcomment %}
    <div class="flex flex-wrap items-center gap-3">
        {% comment %}
            ``button_classes`` rather than includes/_button.html, for the
            same reason the Reset and Delete rows on the settings page use
            it: the partial takes no data-attribute passthrough (SNOW-645
            removed ``extra_attrs`` after semgrep flagged it as an
            attribute-injection surface on a reusable component), and
            ``data-offline-audit-run`` is this module's binding contract.
            The tag gives the same class string the partial would.

            SNOW-907 review: PRIMARY, not ghost. It is the only thing on
            this row that does anything before a report exists, and the
            two controls beside it are both disabled until it has run —
            a row of three equally-weighted ghosts gave no clue which one
            starts.
        {% endcomment %}
        <button
            type="button"
            data-offline-audit-run
            class="{% button_classes variant='primary' size='compact' %} whitespace-nowrap"
        >
            {% translate "Run the check" %}
        </button>
        <button
            type="button"
            data-offline-audit-copy
            hidden
            class="text-sm text-text-2 underline underline-offset-2"
        >
            {% translate "Copy report" %}
        </button>
        <button
            type="button"
            data-offline-audit-save
            hidden
            class="text-sm text-text-2 underline underline-offset-2"
        >
            {% translate "Save the map page" %}
        </button>
        <p
            class="text-sm text-text-3"
            data-offline-audit-status
            role="status"
            aria-live="polite"
        >
        </p>
    </div>

    <div class="mt-2" data-offline-audit-output hidden></div>

    {# SNOW-620: server-translated copy, read back by offline_audit.js. #}
    {# Every key here has an English literal in that module's FALLBACKS, #}
    {# which is what the offline page — where pwaStrings is not loaded — #}
    {# renders. tests/accounts/test_settings_offline_audit.py fails if #}
    {# the two key sets drift. #}
    <template id="offline-audit-strings-template">
        <span data-string="section-device">{% translate "This device" %}</span>
        <span data-string="section-pages">{% translate "Pages saved for offline" %}</span>
        <span data-string="section-files">{% translate "App files" %}</span>
        <span data-string="section-maps">{% translate "Downloaded maps" %}</span>
        <span data-string="section-data">{% translate "Saved data" %}</span>

        <span data-string="label-service-worker">{% translate "Offline mode" %}</span>
        <span data-string="sw-controlling">{% translate "active" %}</span>
        <span data-string="sw-registered-not-controlling">{% translate "starting up" %}</span>
        <span data-string="sw-absent">{% translate "not set up" %}</span>
        <span data-string="sw-unsupported">{% translate "not supported" %}</span>
        <span data-string="note-service-worker">{% translate "offline mode is not running on this device yet" %}</span>
        <span data-string="label-update">{% translate "Update" %}</span>
        <span data-string="update-waiting">{% translate "waiting to install" %}</span>
        <span data-string="note-update">{% translate "a newer version is waiting to install" %}</span>
        <span data-string="label-network-mode">{% translate "Connection" %}</span>
        <span data-string="mode-forced">{% translate "offline mode is on" %}</span>
        <span data-string="mode-latched">{% translate "no usable connection" %}</span>
        <span
            data-string="note-forced"
        >{% translate "offline mode is switched on, so nothing new will be fetched" %}</span>
        <span
            data-string="note-latched"
        >{% translate "the app has stopped trying to reach the network after repeated timeouts" %}</span>
        <span data-string="label-storage">{% translate "Space used" %}</span>
        <span data-string="storage-of">{% translate "%(used)s of %(total)s" %}</span>
        <span
            data-string="note-storage-tight"
        >{% translate "storage is nearly full, so the browser may start deleting downloads" %}</span>
        <span data-string="label-persisted">{% translate "Protected from cleanup" %}</span>
        <span data-string="persisted-yes">{% translate "yes" %}</span>
        <span data-string="persisted-no">{% translate "no" %}</span>
        <span data-string="note-persisted">{% translate "downloads are not protected from browser cleanup" %}</span>

        <span data-string="label-map-page">{% translate "The map page" %}</span>
        <span data-string="page-saved">{% translate "saved" %}</span>
        <span data-string="page-not-saved">{% translate "not saved" %}</span>
        <span data-string="page-other-account">{% translate "another account" %}</span>
        <span data-string="label-pages-saved">{% translate "Pages you can open offline" %}</span>
        <span data-string="page-entry-usable">{% translate "ready" %}</span>

        <span data-string="label-scripts">{% translate "Program files" %}</span>
        <span data-string="label-styles">{% translate "Styling" %}</span>
        <span data-string="label-feeds">{% translate "Data feeds" %}</span>
        <span data-string="label-other-files">{% translate "Fonts and images" %}</span>
        <span data-string="subject-scripts">{% translate "program files" %}</span>
        <span data-string="subject-styles">{% translate "styling" %}</span>
        <span data-string="subject-feeds">{% translate "data feeds" %}</span>
        <span data-string="effect-scripts">{% translate "will open blank" %}</span>
        <span data-string="effect-styles">{% translate "will look plain" %}</span>
        <span data-string="effect-feeds">{% translate "may be missing danger ratings" %}</span>
        <span
            data-string="group-open-map-lead"
        >{% translate "Saved pages %(effects)s — %(subjects)s are not saved yet." %}</span>
        <span
            data-string="group-open-map-remedy"
        >{% translate "Opening the map once while connected fixes %(count)s." %}</span>

        <span data-string="label-areas">{% translate "Downloaded areas" %}</span>
        <span data-string="areas-none">{% translate "none" %}</span>
        <span
            data-string="note-areas-none"
        >{% translate "no map area is downloaded, so there will be nothing to show in the map" %}</span>
        <span data-string="area-tiles">{% translate "%(tiles)s tiles, %(size)s" %}</span>
        <span data-string="area-incomplete">{% translate "incomplete, %(count)s missing" %}</span>
        <span data-string="area-missing">{% translate "not on this device" %}</span>
        <span data-string="area-empty">{% translate "empty" %}</span>
        <span
            data-string="note-area-incomplete"
        >{% translate "%(name)s will not draw until you repair it from the map’s Manage downloads sheet" %}</span>
        <span
            data-string="note-area-missing"
        >{% translate "%(name)s is recorded as downloaded but nothing is stored, so download it again" %}</span>
        <span data-string="label-base-layer">{% translate "Zoomed-out overview (%(basemap)s)" %}</span>
        <span data-string="label-orphan">{% translate "Unnamed area %(id)s" %}</span>
        <span data-string="orphan-value">{% translate "no record" %}</span>
        <span
            data-string="note-orphan"
        >{% translate "some tiles are taking up space with nothing pointing at them" %}</span>

        <span data-string="label-favourites">{% translate "Saved places" %}</span>
        <span data-string="label-overlays">{% translate "Map overlays" %}</span>
        <span data-string="label-panel-rows">{% translate "Reports" %}</span>
        <span data-string="label-mutations">{% translate "Changes waiting to send" %}</span>
        <span
            data-string="note-mutations"
        >{% translate "%(n)s of your changes have not reached the server yet" %}</span>
        <span data-string="label-db">{% translate "Local database" %}</span>

        <span data-string="principal-anonymous">{% translate "signed-out visitor" %}</span>
        <span data-string="principal-account">{% translate "account %(id)s…" %}</span>
        <span data-string="principal-unknown">{% translate "unknown account" %}</span>
        <span data-string="unknown">{% translate "unknown" %}</span>

        <span data-string="verdict-ok">{% translate "The map will open offline." %}</span>
        <span data-string="verdict-no-worker">{% translate "This device is not set up for offline use yet." %}</span>
        <span
            data-string="verdict-no-page"
        >{% translate "The map page is not saved. Open it once while connected." %}</span>
        <span
            data-string="verdict-other-account"
        >{% translate "The saved map page belongs to another account. Open the map once while connected." %}</span>
        <span
            data-string="verdict-no-scripts"
        >{% translate "The app’s program files are not saved, so pages will open blank." %}</span>
        <span
            data-string="verdict-map-incomplete"
        >{% translate "The map page will open, but a downloaded area is incomplete." %}</span>
        <span
            data-string="verdict-map-missing"
        >{% translate "The map page will open, but no area is downloaded to show in it." %}</span>

        <span data-string="notes-sentence">{% translate "Also worth knowing: %(notes)s." %}</span>
        <span data-string="list-pair">{% translate "%(first)s and %(last)s" %}</span>
        <span data-string="list-separator">{% translate ", " %}</span>
        <span data-string="count-one">{% translate "it" %}</span>
        <span data-string="count-two">{% translate "both" %}</span>
        <span data-string="count-many">{% translate "all %(n)s of them" %}</span>

        <span data-string="counts-line">{% translate "%(total)s checks · %(attention)s need attention" %}</span>
        <span data-string="counts-line-clear">{% translate "%(total)s checks · nothing needs attention" %}</span>

        <span data-string="running">{% translate "Checking…" %}</span>
        <span data-string="copied">{% translate "copied" %}</span>
        <span data-string="copy-failed">{% translate "copy failed" %}</span>
        <span data-string="saving">{% translate "Saving the map page…" %}</span>
        <span data-string="saved">{% translate "Saved. Re-checking…" %}</span>
        <span data-string="save-failed">{% translate "That could not be saved. Try again while connected." %}</span>
    </template>
</div>
