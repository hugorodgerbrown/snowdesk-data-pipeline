[project]
name = "snowdesk-data-pipeline"
version = "0.1.0"
description = "Django data pipeline with HTMX frontend"
authors = [{ name = "Hugo Rodger-Brown" }]
requires-python = ">=3.14,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Django>=6.0.7,<7",
    "django-htmx>=1.21.0,<2",
    "python-decouple>=3.8,<4",
    "requests>=2.32.3,<3",
    "psycopg[binary]>=3.2.4,<4",
    "dj-database-url>=3.1.2,<4",
    "whitenoise>=6.12.0,<7",
    "gunicorn>=26.0.0,<27",
    "pyyaml>=6.0.3,<7",
    "bleach>=6.3.0,<7",
    "django-ratelimit>=4.1.0,<5",
    "django-csp-plus>=3.3.0,<4",
    "django-waffle>=5.0.0,<6",
    "webauthn>=2.7.1,<3",
    "defusedxml>=0.7.1,<0.8",
    "geoip2>=5.2.0,<6",
    "pdfplumber>=0.11.9,<0.12",
    "pywebpush>=2.3.0,<3",
    "django-tasks>=0.12.0,<0.13",
    "django-tasks-db>=0.12.0,<0.13",
    "apscheduler>=3.10,<4",
    "posthog>=7.16.3,<8",
    "cryptography>=48.0.1,<49",
    "shapely>=2.1.2,<3",
    "rapidfuzz>=3.14.5,<4",
]

[dependency-groups]
# Purpose-scoped groups map 1:1 to tox envs — see tox.ini's
# `dependency_groups =` and docs/decisions/tox-envs-install-from-uv-lock.md.
# Each tox env syncs only its own group — tox-uv injects `--no-default-groups`
# automatically whenever `dependency_groups` is set — so e.g. `mypy` never
# drags in playwright. `dev` composes all of them via `{include-group = ...}`
# so a bare `uv sync` (local dev, bin/init-worktree) still installs everything.
test = [
    "coverage>=7,<8",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-django>=4.12.0,<5",
    "pytest-xdist>=3.8.0,<4",
    "factory-boy>=3.3.3,<4",
    "freezegun>=1.5.5,<2",
]
type = [
    "mypy>=2.0,<2.1",  # 2.1.0 crashes the django-stubs plugin loader (SNOW-356) — do not widen until fixed upstream
    "django-stubs>=6.0.2,<7",
    "types-requests>=2.33.0.20260408,<3",
    "types-bleach>=6.3.0.20260408,<7",
    "types-defusedxml>=0.7.0.20260504,<0.8",
    # mypy also type-checks tests/, so it needs the same test-authoring
    # packages the `test` group installs (factory-boy's typed `.create()`
    # return, pytest-django fixtures, freezegun) or those call sites collapse
    # to `Any` and mypy misses real type errors.
    {include-group = "test"},
]
lint = [
    # Pinned EXACT (not a range) so `uv lock --upgrade` can't silently float
    # ruff ahead of the pre-commit pin and re-drift CI. Bump this and
    # .pre-commit-config.yaml's rev in lockstep (SNOW-512). See
    # CODING_STANDARDS.md §6.5.
    "ruff==0.16.0",
    "djangofmt>=0.2.6,<0.3",
]
sast = [
    "semgrep>=1.95,<2",
]
e2e = [
    "playwright>=1.0,<2",
    "pytest-playwright>=0.7,<0.9",
    # Bounded automatic-retry net for the real-SW/CacheStorage timing flakes
    # that can't be made fully deterministic (SNOW-516) — e2e-only, see
    # tox.ini's [testenv:e2e] and docs/client-side-tests.md.
    "pytest-rerunfailures>=15,<16",
    {include-group = "test"},
]
dev = [
    "pre-commit>=4.2.0,<5",
    "tox>=4.52.1,<5",
    "tox-uv>=1.0,<2",
    "tox-gh-actions>=3.5.0,<4",
    {include-group = "test"},
    {include-group = "type"},
    {include-group = "lint"},
    {include-group = "sast"},
    {include-group = "e2e"},
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.14"
strict = false
strict_optional = true
ignore_missing_imports = true
follow_imports = "silent"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["decouple", "decouple.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["*.migrations.*", "*.settings.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.development"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-n auto --cov=core --cov=bulletins --cov=regions --cov=public --cov=accounts --cov=analytics --cov=mcp_server --cov=observations --cov=favourites --ignore=tests/e2e"
# pytest-django defaults to DEBUG=False at test time, which silently
# drops URL-conf entries gated on ``if settings.DEBUG:`` (the dev-only
# SLF mirror in config/urls.py, the scrubber-perf debug page in
# public/urls.py). ``keep`` honours the value from the settings module
# (DEBUG=True under config.settings.development) so those routes stay
# registered and their test client GETs resolve.
django_debug_mode = "keep"

[tool.coverage.run]
source = ["core", "bulletins", "regions", "public", "accounts", "analytics", "mcp_server", "observations", "favourites"]
omit = ["bulletins/migrations/*", "regions/migrations/*", "public/migrations/*", "accounts/migrations/*", "observations/migrations/*", "favourites/migrations/*", "config/*", "__init__.py"]

[tool.coverage.report]
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]

[tool.ruff]
line-length = 88
# ruff 0.16 began formatting Python code blocks embedded in Markdown. We do
# not want that: it rewrites illustrative doc snippets into standalone-module
# form (e.g. wrapping a trailing-comma urlpatterns line into a tuple), which
# misleads the reader. ruff has never linted prose docs, so exclude Markdown
# from ruff entirely rather than pinning ruff back (SNOW-506).
extend-exclude = ["docs/research", "*.md"]
# Extensionless Python scripts in bin/ (shebang `#!/usr/bin/env python`). ruff's
# directory scan only discovers *.py by extension, so `ruff format/check .` in
# tox+CI would skip these — but the pre-commit ruff hook (types: [python])
# detects them by shebang and checks them. Listing them here keeps all three
# surfaces on the same file set (SNOW-512). Add any new bin/ Python script here;
# the other bin/ entries are shell scripts and must stay out.
extend-include = ["bin/docs-lint", "bin/ds-lint"]

[tool.ruff.lint]
select = [
    "A",   # flake8 builtins
    "C9",  # mccabe
    "D",   # pydocstyle
    "E",   # pycodestyle (errors)
    "F",   # Pyflakes
    "I",   # isort
    "S",   # flake8-bandit
    "T2",  # flake8-print
    "W",   # pycodestyle (warnings)
]
ignore = [
    "D203",  # 1 blank line required before class docstring
    "D212",  # Multi-line docstring summary should start at the first line
    "D213",  # Multi-line docstring summary should start at the second line
    "D403",  # First word of the first line should be capitalized
    "D404",  # First word of the docstring should not be "This"
    "D405",  # Section name should be properly capitalized
    "D406",  # Section name should end with a newline
    "D407",  # Missing dashed underline after section
    "D410",  # Missing blank line after section
    "D411",  # Missing blank line before section
    "D412",  # No blank lines allowed between a section header and its content
    "D416",  # Section name should end with a colon
    "D417",  # Missing argument description in the docstring
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D"]
"*tests/*" = [
    "D1",    # Missing docstrings
    "D205",  # 1 blank line required between summary line and description
    "D400",  # First line should end with a period
    "D401",  # First line should be in imperative mood
    "D415",  # First line should end with a period, question mark, or exclamation point
    "E501",  # Line too long
    "E731",  # Do not assign a lambda expression, use a def
    "S101",  # Use of assert detected
    "S105",  # Possible hardcoded password
    "S106",  # Possible hardcoded password
    "S113",  # Probable use of requests call with timeout set to {value}
]
"*/migrations/*" = [
    "D1",    # Missing docstrings
    "E501",  # Line too long
]
"*/settings.py" = [
    "F403",  # from {name} import * used; unable to detect undefined names
    "F405",  # {name} may be undefined, or defined from star imports
]
"*/settings/*" = [
    "F403",  # from {name} import * used; unable to detect undefined names
    "F405",  # {name} may be undefined, or defined from star imports
]
