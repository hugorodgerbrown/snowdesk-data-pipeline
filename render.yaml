# Render deployment Blueprint for Snowdesk.
#
# Blueprint auto-sync IS enabled — Render reads this file from `main` and
# applies changes to the services declared here (see the Blueprint entry in
# the Render dashboard). Databases and env-group contents remain
# dashboard-managed: no `databases:` block, and env-var groups are
# referenced by `fromGroup` rather than declared. That deliberately keeps
# secrets and Postgres wiring out of Blueprint's scope.
#
# Path-to-live (SNOW-339): deploys are split across two branches.
#   * `main`    → Staging   — one web service, auto-deploys on every merge.
#   * `release` → Production — three services, deploy when the `release`
#                 branch advances (a release PR merges). All three track
#                 the SAME branch so they always run the same commit
#                 against the shared production database.
# The Blueprint source branch and the per-service deploy branch are
# independent: Blueprint reads this file from `main`, and each service's
# `branch:` field governs which branch it deploys from.
#
# Staging and production use SEPARATE Postgres databases. This matters
# because build.sh runs `migrate` + `loaddata` on every deploy — a staging
# deploy must never touch the production schema. Full flow: docs/deployment.md.
#
# `snowdesk-scheduler` (SNOW-238) is a single long-running APScheduler
# worker that replaces the older per-schedule Render cron jobs.
# `snowdesk-background-tasks` (SNOW-229) consumes the django-tasks-db
# queue used by subscription emails.
#
# Env vars marked `sync: false` must be set manually in the Render
# dashboard — they are not auto-populated from a Blueprint import.

version: "1"
projects:
  - name: Snowdesk
    environments:
      - name: Production
        services:
          - type: worker
            name: snowdesk-background-tasks
            runtime: python
            repo: https://github.com/hugorodgerbrown/snowdesk-data-pipeline
            plan: starter
            region: frankfurt
            branch: release
            buildCommand: ./build_headless.sh
            startCommand: python manage.py db_worker
            autoDeployTrigger: checksPass
            envVars:
              - fromGroup: Production

          - type: worker
            name: snowdesk-scheduler
            runtime: python
            repo: https://github.com/hugorodgerbrown/snowdesk-data-pipeline
            plan: starter
            region: frankfurt
            branch: release
            buildCommand: ./build_headless.sh
            startCommand: python manage.py run_scheduler
            autoDeployTrigger: checksPass
            envVars:
              - fromGroup: Production

          - type: web
            name: snowdesk-website
            runtime: python
            repo: https://github.com/hugorodgerbrown/snowdesk-data-pipeline
            plan: starter
            region: frankfurt
            branch: release
            buildCommand: . ./build.sh
            startCommand: gunicorn config.wsgi
            domains:
              - www.snowdesk.info
              - snowdesk.info
            autoDeployTrigger: checksPass
            envVars:
              - key: METEOFRANCE_API_KEY
                sync: false
              - key: CSP_REPORT_ONLY
                sync: false
              - key: WEBAUTHN_ORIGIN
                sync: false
              - key: WEBAUTHN_RP_NAME
                sync: false
              - key: WEBAUTHN_RP_ID
                sync: false
              - fromGroup: Production

      - name: Staging
        # Single web dyno, auto-deploys from `main`. No scheduler and no
        # background-tasks worker — staging does not ingest bulletins or
        # send queued email on its own; seed its database with a manual
        # `fetch_bulletins` run when test data is needed. Wired to its own
        # Postgres and its own env group (separate SECRET_KEY, DATABASE_URL,
        # ALLOWED_HOSTS, email target) — never the production database.
        services:
          - type: web
            name: snowdesk-staging
            runtime: python
            repo: https://github.com/hugorodgerbrown/snowdesk-data-pipeline
            plan: starter
            region: frankfurt
            branch: main
            buildCommand: . ./build.sh
            startCommand: gunicorn config.wsgi
            autoDeployTrigger: checksPass
            envVars:
              - key: POSTHOG_API_KEY
                sync: false
              - fromGroup: Staging
