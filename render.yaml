# Render deployment Blueprint for Snowdesk.
#
# Blueprint auto-sync IS enabled — Render reads this file from `main` and
# applies changes to the services declared here (see the Blueprint entry in
# the Render dashboard). Databases and env-group contents remain
# dashboard-managed: no `databases:` block, and env-var groups are
# referenced by `fromGroup` rather than declared. That deliberately keeps
# secrets and Postgres wiring out of Blueprint's scope.
#
# Path-to-live (SNOW-339): deploys are split across two branches.
#   * `main`    → Staging   — one web service, auto-deploys on every merge.
#   * `release` → Production — three services, deploy when the `release`
#                 branch advances (a fast-forward of `release` to `main`;
#                 see bin/cut-release). All three track the SAME branch so
#                 they always run the same commit against the shared
#                 production database.
# The Blueprint source branch and the per-service deploy branch are
# independent: Blueprint reads this file from `main`, and each service's
# `branch:` field governs which branch it deploys from.
#
# Staging and production use SEPARATE Postgres databases. This matters
# because build.sh runs `migrate` on every deploy — a staging deploy must
# never touch the production schema. Full flow: docs/deployment.md.
#
# ONE MIGRATOR: only the web service migrates. Both workers build with
# build_headless.sh, which installs dependencies and writes nothing to the
# database — the three services build CONCURRENTLY against one Postgres, and
# three racing `migrate` runs deadlock. See docs/deployment.md.
#
# `snowdesk-scheduler` (SNOW-238) is a single long-running APScheduler
# worker that replaces the older per-schedule Render cron jobs.
# `snowdesk-background-tasks` (SNOW-229) consumes the django-tasks-db
# queue used by subscription emails.
#
# Env vars marked `sync: false` must be set manually in the Render
# dashboard — they are not auto-populated from a Blueprint import.
#
# `healthCheckPath` (SNOW-565) points at `/livez`, NOT `/healthz`. Render
# uses this path to gate deploy promotion and instance health, so it must
# answer the question "should this instance be replaced?" — `/livez` touches
# no database. `/healthz` additionally reads `auth_user`, which is the right
# check for an external monitor (it alerts a human) and the wrong one here
# (a transient Postgres blip would block a good deploy or restart an
# instance that was still serving). Neither worker declares a health check:
# Render background workers cannot take an HTTP probe.

version: "1"
projects:
  - name: Snowdesk
    environments:
      - name: Production
        services:
          - type: worker
            name: snowdesk-background-tasks
            runtime: python
            repo: https://github.com/hugorodgerbrown/snowdesk-data-pipeline
            plan: starter
            region: frankfurt
            branch: release
            buildCommand: ./bin/build_headless.sh
            startCommand: uv run --no-sync python manage.py db_worker
            autoDeployTrigger: checksPass
            envVars:
              - fromGroup: Production

          - type: worker
            name: snowdesk-scheduler
            runtime: python
            repo: https://github.com/hugorodgerbrown/snowdesk-data-pipeline
            plan: starter
            region: frankfurt
            branch: release
            buildCommand: ./bin/build_headless.sh
            startCommand: uv run --no-sync python manage.py run_scheduler
            autoDeployTrigger: checksPass
            envVars:
              - fromGroup: Production

          - type: web
            name: snowdesk-website
            runtime: python
            repo: https://github.com/hugorodgerbrown/snowdesk-data-pipeline
            plan: starter
            region: frankfurt
            branch: release
            buildCommand: ./bin/build.sh
            startCommand: uv run --no-sync gunicorn config.wsgi
            healthCheckPath: /livez
            domains:
              - www.snowdesk.info
              - snowdesk.info
            autoDeployTrigger: checksPass
            envVars:
              - key: CSP_REPORT_ONLY
                sync: false
              - key: WEBAUTHN_ORIGIN
                sync: false
              - key: WEBAUTHN_RP_NAME
                sync: false
              - key: WEBAUTHN_RP_ID
                sync: false
              - fromGroup: Production

      - name: Staging
        # Single web dyno, auto-deploys from `main`, plus one nightly cron
        # job. No scheduler and no background-tasks worker — staging does not
        # ingest bulletins on its own, so the cron job below copies the
        # provider-derived tables out of production instead (SNOW-729).
        # Because there is no db_worker, staging runs the
        # `config.settings.staging` module, which overrides the task backend
        # to ImmediateBackend so subscription email is sent inline on the
        # request instead of being queued to a worker that never runs. Wired
        # to its own Postgres and its own env group (separate SECRET_KEY,
        # DATABASE_URL, ALLOWED_HOSTS, email target) — never the production
        # database.
        services:
          - type: web
            name: snowdesk-staging
            runtime: python
            repo: https://github.com/hugorodgerbrown/snowdesk-data-pipeline
            plan: starter
            region: frankfurt
            branch: main
            buildCommand: ./bin/build.sh
            startCommand: uv run --no-sync gunicorn config.wsgi
            healthCheckPath: /livez
            autoDeployTrigger: checksPass
            envVars:
              # Staging inherits production hardening but sends email inline
              # (no db_worker). Pinned here so it is version-controlled and
              # not dependent on a manual dashboard edit to the env group.
              - key: DJANGO_SETTINGS_MODULE
                value: config.settings.staging
              - fromGroup: Staging

          # DISABLED 2026-08-27 — the refresh is run by hand for now. The service
          # definition is commented out rather than deleted; the rationale below it
          # still holds and is worth keeping for whenever it goes back on a
          # schedule. Re-enable by uncommenting the block at the end.
          #
          # NOTE: this stops Blueprint *managing* the service. It does not
          # necessarily remove a cron job Render has already created — suspend or
          # delete `snowdesk-staging-data-sync` in the dashboard too, or it keeps
          # firing at 07:20 UTC against whatever is on main.
          #
          # Nightly refresh of staging's bulletin and weather tables from the
          # production database (SNOW-729). Staging has no scheduler, so
          # without this its data is whatever the last manual `fetch_bulletins`
          # left behind — usually empty or months stale.
          #
          # Copies bulletins, weather, and the curated resort estate (Resort +
          # its village/mid/peak Locations). Copies NO user data: no auth_user,
          # no Account, no passkeys, no push subscriptions, no routes, no
          # observations, no favourites, no request logs. That is what makes it
          # safe to run unattended with no anonymisation step, and it matters
          # because staging sends email inline (ImmediateBackend above) — a
          # copied subscriber list would be a copied mailing list.
          #
          # locations_location is the one MIXED table: it holds a resort's
          # village/mid/peak alongside a row per saved favourite and per field
          # report. The copy restricts it to rows a ResortLocation references,
          # so a user's saved position is never even read. The table lists and
          # the reason for each exclusion live in the script's own header.
          #
          # SNOW-736 replaced the original row-by-row ORM copy with pg_dump /
          # psql. The ORM version pushed ~230 INSERT ... ON CONFLICT statements
          # for a single table and put the staging database into crash
          # recovery; COPY moves the same rows in one statement per table.
          #
          # PRODUCTION_DATABASE_URL is dashboard-set (`sync: false`) and must
          # hold a READ-ONLY production role. The command never issues a write
          # against it and a router blocks migrations on it, but the role is
          # the actual guarantee — see
          # docs/runbooks/refresh-staging-from-production.md for creating it.
          #
          # 07:20 UTC: after production's 06:00 fetch_weather pass and the
          # hourly fetch_bulletins run that picks up the morning issue
          # (schedule.py), so staging opens the working day already current.
          # - type: cronjob
          #   name: snowdesk-staging-data-sync
          #   runtime: python
          #   repo: https://github.com/hugorodgerbrown/snowdesk-data-pipeline
          #   plan: starter
          #   region: frankfurt
          #   branch: main
          #   schedule: "20 7 * * *"
          #   buildCommand: ./bin/build_headless.sh
          #   startCommand: ./bin/sync-staging-data --commit
          #   envVars:
          #     - key: DJANGO_SETTINGS_MODULE
          #       value: config.settings.staging
          #     - key: PRODUCTION_DATABASE_URL
          #       sync: false
          #     - fromGroup: Staging
