# Render deployment Blueprint for Snowdesk.
#
# Blueprint auto-sync IS enabled — Render reads this file from `main` and
# applies changes to the services declared here (see the Blueprint entry in
# the Render dashboard). Databases and env-group contents remain
# dashboard-managed: no `databases:` block, and env-var groups are
# referenced by `fromGroup` rather than declared. That deliberately keeps
# secrets and Postgres wiring out of Blueprint's scope.
#
# Path-to-live (SNOW-339): deploys are split across two branches.
#   * `main`    → Staging   — one web service, auto-deploys on every merge.
#   * `release` → Production — three services, deploy when the `release`
#                 branch advances (a fast-forward of `release` to `main`;
#                 see bin/cut-release). All three track the SAME branch so
#                 they always run the same commit against the shared
#                 production database.
# The Blueprint source branch and the per-service deploy branch are
# independent: Blueprint reads this file from `main`, and each service's
# `branch:` field governs which branch it deploys from.
#
# Staging and production use SEPARATE Postgres databases (snowdesk_staging and
# snowdeskdb, both on the one snowdesk-database instance). This matters because
# build.sh runs `migrate` on every deploy — a staging deploy must never touch
# the production schema. Full flow: docs/deployment.md. Diagram:
# docs/img/architecture-runtime.svg.
#
# ONE MIGRATOR: only the web service migrates. Both workers build with
# build_headless.sh, which installs dependencies and writes nothing to the
# database — the three services build CONCURRENTLY against one Postgres, and
# three racing `migrate` runs deadlock. See docs/deployment.md.
#
# `snowdesk-scheduler` (SNOW-238) is a single long-running APScheduler
# worker that replaces the older per-schedule Render cron jobs.
# `snowdesk-background-tasks` (SNOW-229) consumes the django-tasks-db
# queue: email, push, the bulk commands' row tasks and ops MCP run_command
# (docs/async-operations.md).
#
# Env vars marked `sync: false` must be set manually in the Render
# dashboard — they are not auto-populated from a Blueprint import.
#
# `healthCheckPath` (SNOW-565) points at `/livez`, NOT `/healthz`. Render
# uses this path to gate deploy promotion and instance health, so it must
# answer the question "should this instance be replaced?" — `/livez` touches
# no database. `/healthz` additionally reads `auth_user`, which is the right
# check for an external monitor (it alerts a human) and the wrong one here
# (a transient Postgres blip would block a good deploy or restart an
# instance that was still serving). Neither worker declares a health check:
# Render background workers cannot take an HTTP probe.

version: "1"
projects:
  - name: Snowdesk
    environments:
      - name: Production
        services:
          - type: worker
            name: snowdesk-background-tasks
            runtime: python
            repo: https://github.com/hugorodgerbrown/snowdesk-data-pipeline
            plan: starter
            region: frankfurt
            branch: release
            buildCommand: ./bin/build_headless.sh
            startCommand: uv run --no-sync python manage.py db_worker
            autoDeployTrigger: checksPass
            envVars:
              - fromGroup: Production

          - type: worker
            name: snowdesk-scheduler
            runtime: python
            repo: https://github.com/hugorodgerbrown/snowdesk-data-pipeline
            plan: starter
            region: frankfurt
            branch: release
            buildCommand: ./bin/build_headless.sh
            startCommand: uv run --no-sync python manage.py run_scheduler
            autoDeployTrigger: checksPass
            envVars:
              - fromGroup: Production

          - type: web
            name: snowdesk-website
            runtime: python
            repo: https://github.com/hugorodgerbrown/snowdesk-data-pipeline
            plan: starter
            region: frankfurt
            branch: release
            buildCommand: ./bin/build.sh
            startCommand: uv run --no-sync gunicorn config.wsgi
            healthCheckPath: /livez
            domains:
              - www.snowdesk.info
              - snowdesk.info
            autoDeployTrigger: checksPass
            envVars:
              - key: CSP_REPORT_ONLY
                sync: false
              - key: WEBAUTHN_ORIGIN
                sync: false
              - key: WEBAUTHN_RP_NAME
                sync: false
              - key: WEBAUTHN_RP_ID
                sync: false
              - fromGroup: Production

      - name: Staging
        # Single web dyno, auto-deploys from `main`, plus one nightly cron
        # job. No scheduler and no background-tasks worker — staging does not
        # ingest bulletins on its own, so the cron job below pulls them from
        # production's data feed instead (SNOW-1200).
        # Because there is no db_worker, staging runs the
        # `config.settings.staging` module, which overrides the task backend
        # to ImmediateBackend so subscription email is sent inline on the
        # request instead of being queued to a worker that never runs. Wired
        # to its own database (snowdesk_staging, on the shared instance) and
        # its own env group (separate SECRET_KEY, DATABASE_URL, ALLOWED_HOSTS,
        # email target) — never the production database.
        services:
          - type: web
            name: snowdesk-staging
            runtime: python
            repo: https://github.com/hugorodgerbrown/snowdesk-data-pipeline
            plan: starter
            region: frankfurt
            branch: main
            buildCommand: ./bin/build.sh
            startCommand: uv run --no-sync gunicorn config.wsgi
            healthCheckPath: /livez
            autoDeployTrigger: checksPass
            envVars:
              # Staging inherits production hardening but sends email inline
              # (no db_worker). Pinned here so it is version-controlled and
              # not dependent on a manual dashboard edit to the env group.
              - key: DJANGO_SETTINGS_MODULE
                value: config.settings.staging
              # Staging never downloads the GeoLite2 database. It redeploys on
              # every merge to main from a fresh checkout, so each deploy spent
              # one of MaxMind's 30 downloads per account per 24h and pushed
              # production's release deploys into 429s. RequestLog geo fields
              # are empty on staging as a result. See bin/fetch-geoip-data.
              - key: GEOIP_DOWNLOAD
                value: "off"
              # The production data feed client (SNOW-1197): the cron job
              # below pulls with `pull_reference_data` (v2), and
              # `pull_production_data` (v1) is there for a manual top-up.
              # The URL is production's https://…/api/data/v1/; pull_reference_data
              # swaps in v2/ on the same host; the id and
              # secret are the service client created in production's admin
              # (docs/data-feed.md). Dashboard-set, never committed.
              - key: DATA_FEED_URL
                sync: false
              - key: DATA_FEED_CLIENT_ID
                sync: false
              - key: DATA_FEED_CLIENT_SECRET
                sync: false
              - fromGroup: Staging

          # Daily pull from production's reference-data feed (SNOW-1200; v2
          # since SNOW-1281). Staging has no scheduler, so this cron job is what
          # keeps its estate, bulletins, day ratings and weather current. It
          # reads the estate whole (tombstones honoured) and the last 14 days of
          # the time series, so a run missed for up to a fortnight is caught up
          # by the next; every apply is idempotent, so an unchanged row is not
          # written. It exits non-zero when any item fails, so a broken pull
          # shows as a failed run in Render. 07:20 UTC, after production's
          # 06:00 fetch_weather and the morning bulletin issue (schedule.py).
          # The DATA_FEED_* values are the web service's, set in the dashboard;
          # the client pair is exchanged for a token scoped to /api/data/v2/.
          - type: cron
            name: snowdesk-staging-data-pull
            runtime: python
            repo: https://github.com/hugorodgerbrown/snowdesk-data-pipeline
            plan: starter
            region: frankfurt
            branch: main
            schedule: "20 7 * * *"
            buildCommand: ./bin/build_headless.sh
            startCommand: uv run --no-sync python manage.py pull_reference_data --commit
            envVars:
              - key: DJANGO_SETTINGS_MODULE
                value: config.settings.staging
              - key: SNOWDESK_INVOKED_VIA
                value: SCHEDULER
              - key: DATA_FEED_URL
                sync: false
              - key: DATA_FEED_CLIENT_ID
                sync: false
              - key: DATA_FEED_CLIENT_SECRET
                sync: false
              - fromGroup: Staging
