# Render deployment Blueprint for Snowdesk.
#
# Documentation only — Blueprint auto-sync is NOT enabled. Changes to the
# live deployment are still made via the Render dashboard; this file is the
# checked-in record of that configuration so the production topology
# (one web service, two background workers, env-var wiring) is discoverable
# from the repo.
#
# Originally exported from Render on 2026-05-22. Corrections / additions
# applied against the raw export:
#   * snowdesk-cron-bulletins: added `meteofrance` to --source.
#   * snowdesk-cron-bulletins: dropped --today so a missed run self-heals.
#   * snowdesk-worker-tasks (SNOW-229): added the django-tasks-db worker
#     entry. The worker must also be created in the Render dashboard
#     before subscription emails enqueue to django_tasks_db will be
#     consumed in production.
#   * snowdesk-scheduler (SNOW-238): replaced snowdesk-cron-bulletins and
#     snowdesk-cron-weather with a single long-running APScheduler worker.
#
# Env vars marked `sync: false` must be set manually in the Render
# dashboard — they are not auto-populated from a Blueprint import.

version: "1"
projects:
  - name: Snowdesk
    environments:
      - name: Production
        services:
          - type: web
            name: snowdesk-website
            runtime: python
            repo: https://github.com/hugorodgerbrown/snowdesk-data-pipeline
            plan: starter
            region: frankfurt
            buildCommand: . ./build.sh
            startCommand: gunicorn config.wsgi
            domains:
              - www.snowdesk.info
              - snowdesk.info
            autoDeployTrigger: commit
            envVars:
              - key: METEOFRANCE_API_KEY
                sync: false
              - key: CSP_REPORT_ONLY
                sync: false
              - key: WEBAUTHN_ORIGIN
                sync: false
              - key: WEBAUTHN_RP_NAME
                sync: false
              - key: WEBAUTHN_RP_ID
                sync: false
              - fromGroup: Django App Settings

          - type: worker
            name: snowdesk-scheduler
            runtime: python
            repo: https://github.com/hugorodgerbrown/snowdesk-data-pipeline
            plan: starter
            region: frankfurt
            buildCommand: ./build_headless.sh
            startCommand: python manage.py run_scheduler
            autoDeployTrigger: commit
            envVars:
              - fromGroup: Django App Settings

          - type: worker
            name: snowdesk-worker-tasks
            runtime: python
            repo: https://github.com/hugorodgerbrown/snowdesk-data-pipeline
            plan: starter
            region: frankfurt
            buildCommand: ./build_headless.sh
            startCommand: python manage.py db_worker
            autoDeployTrigger: commit
            envVars:
              - fromGroup: Django App Settings
