# .github/workflows/security-audit.yml — Audit locked Python dependencies
# for known CVEs on every push/PR and on a weekly cron, so newly-published
# advisories surface even when the lockfile has not changed. Also runs SAST
# (semgrep) and a gitleaks secret scan — the CI backstop for the bypassable
# pre-commit gitleaks hook (invariant #5: no secrets in source).
#
# Two dependency-audit jobs, deliberately separate (SNOW-576):
#   * ``Security audit`` — the runtime gate, --no-dev, a required check.
#   * ``Dependency audit (dev + npm)`` — detection only, covers the dev
#     groups and the npm tree, NOT a required check. Keeping them apart is
#     what stops an advisory in a linter blocking a production release while
#     still surfacing it.
#
# Docs-only PRs skip pip-audit and semgrep via the ``changes`` gate — a
# job-level skip still reports a (skipped) check run that satisfies any
# ruleset requirement (SNOW-481). The gitleaks scan is deliberately NOT
# gated: Markdown can leak credentials just as well as code can, and the
# weekly cron plus push runs are unaffected either way.
#
# The cron run scans full history, so it can fail on a commit that no PR
# ever touched — it went red for four consecutive Mondays before anyone
# noticed (SNOW-599). ``Secret scan (gitleaks)`` is a required check on both
# the main and release rulesets, so a red cron run blocks releases outright:
# treat a failure here as release-blocking, not informational. Allowlisted
# historical findings live in ``.gitleaks.toml``.

name: Security audit

on:
  push:
    branches:
      - main
      - release

  pull_request:
    types: [opened, synchronize, reopened]

  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

  # Run the full-history gitleaks scan on demand. Push and pull_request runs
  # scan only their commit range, so without this the only way to verify a
  # change to .gitleaks.toml is to wait for the Monday cron — which is how the
  # scan stayed red for four weeks (SNOW-599).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: every job gets a read-only token unless it
# overrides this with a narrower/wider scope (SNOW-506).
permissions:
  contents: read

jobs:
  changes:
    name: Detect docs-only diff
    runs-on: ubuntu-latest
    # The docs-only filter lists PR files via the REST API, which needs
    # pull-requests:read on top of the default contents:read.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # "true" unless this is a docs-only pull request; push and schedule
      # runs skip the filter step and fall through to "true".
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - name: Check the PR diff for non-docs files
        id: filter
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail open: an empty file list (API error) runs the full suite.
          files="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')" || files=""
          code=false
          [ -n "$files" ] || code=true
          while IFS= read -r f; do
            case "$f" in
              "" | *.md | docs/* | .claude/*) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "docs-only filter -> code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python (3.14)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Export locked dependencies
        run: >-
          uv export
          --frozen
          --no-dev
          --no-emit-project
          --no-hashes
          --format requirements-txt
          --output-file /tmp/requirements-audit.txt

      - name: Audit dependencies for known CVEs
        run: pip-audit -r /tmp/requirements-audit.txt

  dependency-audit-dev:
    # Detection-only counterpart to `Security audit` above, covering what the
    # runtime gate cannot see: the dev dependency groups (104 of the 169
    # packages in uv.lock) and the npm tree — SNOW-576.
    #
    # This is deliberately NOT in either ruleset's required-check list. The
    # runtime gate stays scoped to --no-dev so an advisory in a linter can
    # never block a production release; this job makes the same advisory
    # *visible* without giving it that power. Do not promote it to a required
    # check, and do not fold it into the `Security audit` job.
    name: Dependency audit (dev + npm)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python (3.14)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # npm is needed for the `npm audit` step of the tox env. No `npm ci`:
      # the env audits with --package-lock-only, straight from the lockfile.
      - name: Set up Node (20)
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install tox
        run: pip install tox tox-uv

      - name: Audit dev groups and the npm tree
        run: tox -e audit-dev

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python (3.14)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install tox
        run: pip install tox tox-uv

      - name: Run semgrep via tox
        run: tox -e sast

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action reads the PR commit range via the REST API on
    # pull_request events, so it needs pull-requests:read alongside the
    # checkout's contents:read.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Full history so the scan covers every commit in the push/PR range,
          # not just the tip. Mirrors the pre-commit gitleaks hook.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin to the same version the pre-commit hook runs (see
          # .pre-commit-config.yaml). Left unpinned the action installs its own
          # default, which drifted to 8.24.3 while pre-commit ran 8.30.0 — a
          # commit could then pass the hook and fail CI, or vice versa. Both
          # sides read .gitleaks.toml, so both must parse it identically.
          GITLEAKS_VERSION: "8.30.0"
          # Disable PR review comments: they need pull-requests:write, which
          # would defeat the least-privilege scoping (SNOW-506). The gate is
          # the non-zero exit on a detected leak, not the comment. The scan
          # still reads the PR commit range under pull-requests:read above.
          GITLEAKS_ENABLE_COMMENTS: "false"
