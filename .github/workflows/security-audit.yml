# .github/workflows/security-audit.yml — Audit locked Python dependencies
# for known CVEs on every push/PR and on a weekly cron, so newly-published
# advisories surface even when the lockfile has not changed. Also runs SAST
# (semgrep) and a gitleaks secret scan — the CI backstop for the bypassable
# pre-commit gitleaks hook (invariant #5: no secrets in source).
#
# Docs-only PRs skip pip-audit and semgrep via the ``changes`` gate — a
# job-level skip still reports a (skipped) check run that satisfies any
# ruleset requirement (SNOW-481). The gitleaks scan is deliberately NOT
# gated: Markdown can leak credentials just as well as code can, and the
# weekly cron plus push runs are unaffected either way.

name: Security audit

on:
  push:
    branches:
      - main
      - release

  pull_request:
    types: [opened, synchronize, reopened]

  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: every job gets a read-only token unless it
# overrides this with a narrower/wider scope (SNOW-506).
permissions:
  contents: read

jobs:
  changes:
    name: Detect docs-only diff
    runs-on: ubuntu-latest
    # The docs-only filter lists PR files via the REST API, which needs
    # pull-requests:read on top of the default contents:read.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # "true" unless this is a docs-only pull request; push and schedule
      # runs skip the filter step and fall through to "true".
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - name: Check the PR diff for non-docs files
        id: filter
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail open: an empty file list (API error) runs the full suite.
          files="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')" || files=""
          code=false
          [ -n "$files" ] || code=true
          while IFS= read -r f; do
            case "$f" in
              "" | *.md | docs/* | .claude/*) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "docs-only filter -> code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python (3.14)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Export locked dependencies
        run: >-
          uv export
          --frozen
          --no-dev
          --no-emit-project
          --no-hashes
          --format requirements-txt
          --output-file /tmp/requirements-audit.txt

      - name: Audit dependencies for known CVEs
        run: pip-audit -r /tmp/requirements-audit.txt

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python (3.14)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install tox
        run: pip install tox

      - name: Run semgrep via tox
        run: tox -e sast

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action reads the PR commit range via the REST API on
    # pull_request events, so it needs pull-requests:read alongside the
    # checkout's contents:read.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Full history so the scan covers every commit in the push/PR range,
          # not just the tip. Mirrors the pre-commit gitleaks hook.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable PR review comments: they need pull-requests:write, which
          # would defeat the least-privilege scoping (SNOW-506). The gate is
          # the non-zero exit on a detected leak, not the comment. The scan
          # still reads the PR commit range under pull-requests:read above.
          GITLEAKS_ENABLE_COMMENTS: "false"
