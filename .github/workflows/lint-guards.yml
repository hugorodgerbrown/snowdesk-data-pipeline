# .github/workflows/lint-guards.yml — Design-system, documentation, and
# template-formatting linters.
#
# Runs ``tox -e ds-lint`` (template design-token guard), ``tox -e docs-lint``
# (docs frontmatter + CLAUDE.md routing guard), and ``tox -e djangofmt``
# (template formatting — the CI backstop for the bypassable pre-commit hook).
#
# The three job contexts are required status checks in the "Main branch
# rules" ruleset, so the ``pull_request`` trigger runs on every PR with no
# path filter — a path-filtered required check never reports on PRs outside
# its paths and leaves them stuck at "Expected" (SNOW-435). The ``push``
# trigger keeps a path filter: pushes to main/release are not merge-gated,
# so it only needs to run when templates, docs, or the linters change.
# Isolated from ci.yml so the guards stay a fast, focused gate without
# triggering the full Python matrix.

name: Lint guards

on:
  push:
    branches:
      - main
      - release
    paths:
      - "**/*.html"
      - "docs/**"
      - "CLAUDE.md"
      - "bin/ds-lint"
      - "bin/docs-lint"
      - "tox.ini"
      - ".github/workflows/lint-guards.yml"

  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Run lint guards
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toxenv: [ds-lint, docs-lint, djangofmt]
    env:
      TOXENV: ${{ matrix.toxenv }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python (3.14)
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install and run tox
        run: |
          pip install tox
          tox
