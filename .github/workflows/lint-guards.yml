# .github/workflows/lint-guards.yml — Design-system, documentation,
# template-formatting, and SW shell cache-version linters.
#
# Runs ``tox -e ds-lint`` (template design-token guard), ``tox -e docs-lint``
# (docs frontmatter + CLAUDE.md routing guard), ``tox -e djangofmt``
# (template formatting — the CI backstop for the bypassable pre-commit
# hook), and ``tox -e sw-version`` (SNOW-517 — CACHE_VERSION must be
# bumped whenever a shell source changes; see apps/core/sw_shell.py and
# docs/offline-map.md).
#
# The job contexts are required status checks in the "Main branch rules"
# ruleset, so the ``pull_request`` trigger runs on every PR with no path
# filter — a path-filtered required check never reports on PRs outside
# its paths and leaves them stuck at "Expected" (SNOW-435). The ``push``
# trigger keeps a path filter: pushes to main/release are not merge-gated,
# so it only needs to run when templates, docs, the linters, or a shell
# source change. Isolated from ci.yml so the guards stay a fast, focused
# gate without triggering the full Python matrix.

name: Lint guards

on:
  # The push trigger is deliberately NOT path-filtered — see SNOW-600. Every
  # commit on main is a release candidate, and the "Release branch" ruleset
  # requires this workflow's checks on the commit it fast-forwards to. A
  # `paths:` filter here means the workflow is never *scheduled* on a commit
  # that misses it, so the required check never reports and the release push
  # is blocked forever. That is different from a job-level skip, which still
  # reports a (skipped) check run and satisfies the ruleset. Unlike ci.yml and
  # e2e.yml this workflow has no `changes` gate — every guard here is a
  # seconds-long script, so there is nothing worth gating.
  push:
    branches:
      - main
      - release

  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: the linters only read the checkout (SNOW-506).
permissions:
  contents: read

jobs:
  lint:
    name: Run lint guards
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toxenv: [ds-lint, docs-lint, djangofmt, sw-version]
    env:
      TOXENV: ${{ matrix.toxenv }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python (3.14)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install and run tox
        run: |
          pip install tox tox-uv
          tox
