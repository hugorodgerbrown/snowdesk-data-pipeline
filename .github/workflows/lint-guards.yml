# .github/workflows/lint-guards.yml — Design-system, documentation and
# template-formatting linters.
#
# Runs ``tox -e ds-lint`` (design-token guard over templates AND
# static/js), ``tox -e i18n-lint`` (user-facing strings hardcoded in JS),
# ``tox -e js-globals-lint`` (reads of globals nothing
# assigns), ``tox -e docs-lint`` (docs frontmatter + CLAUDE.md routing
# guard), ``tox -e migrations-lint`` (duplicate migration numbers and
# multi-leaf migration graphs — SNOW-652; it sees the collision because a
# ``pull_request`` checkout is the MERGE commit, so the tree already holds
# main's migrations alongside the PR's, which is exactly the union each
# PR's own ``django-checks`` run cannot see under a non-strict ruleset)
# ``tox -e fidelity-lint`` (SNOW-671 — every CAAML path in every committed
# sentinel is either rendered or carries a written reason for not being;
# only the structural half runs here, since the rendering half needs
# Django and runs under ``tox -e test``) and ``tox -e djangofmt``
# (template formatting — the CI backstop for the bypassable pre-commit
# hook).
#
# SNOW-619 added the JavaScript half. The project has deliberately avoided
# a JS toolchain, so rather than adopt ESLint these extend the guards
# already here to cover what the 2026-08-03 review actually found: class
# strings built in JS were held to no token rules at all, and a
# ``window.X`` read against a name nothing assigns survived a module's
# whole life with no linter able to see it (ESLint's ``no-undef`` cannot
# look through a member expression either).
#
# The SW shell cache-version guard (``tox -e sw-version``, SNOW-517) used to
# run here too. SNOW-590 derives the cache version from the shell content
# hash at serve time instead of hand-bumping a constant, so there is no
# longer a bump to police — the guard, its CLI and its committed hash file
# are all gone. What remains of that safety net is
# ``apps.core.checks.check_sw_cache_version_substitutable``, which runs in
# ``tox -e django-checks``.
#
# The job contexts are required status checks in the "Main branch rules"
# ruleset, so neither trigger is path-filtered: a path-filtered required
# check never reports on the commits outside its paths, leaving PRs stuck
# at "Expected" (SNOW-435) and starving the release push of the contexts
# its ruleset requires (SNOW-600). Isolated from ci.yml so the guards stay
# a fast, focused gate without triggering the full Python matrix.

name: Lint guards

on:
  # The push trigger is deliberately NOT path-filtered — see SNOW-600. Every
  # commit on main is a release candidate, and the "Release branch" ruleset
  # requires this workflow's checks on the commit it fast-forwards to. A
  # `paths:` filter here means the workflow is never *scheduled* on a commit
  # that misses it, so the required check never reports and the release push
  # is blocked forever. That is different from a job-level skip, which still
  # reports a (skipped) check run and satisfies the ruleset. Unlike ci.yml and
  # e2e.yml this workflow has no `changes` gate — every guard here is a
  # seconds-long script, so there is nothing worth gating.
  push:
    branches:
      - main
      - release

  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: the linters only read the checkout (SNOW-506).
permissions:
  contents: read

jobs:
  lint:
    name: Run lint guards
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toxenv: [ds-lint, js-globals-lint, i18n-lint, docs-lint, e2e-lint, fidelity-lint, migrations-lint, djangofmt]
    env:
      TOXENV: ${{ matrix.toxenv }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python (3.14)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install and run tox
        run: |
          pip install tox tox-uv
          tox
