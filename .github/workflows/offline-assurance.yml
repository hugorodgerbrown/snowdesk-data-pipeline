# .github/workflows/offline-assurance.yml — offline-maps assurance.
#
# Runs `tox -e offline` (tests/offline/): real downloads of real basemap
# tiles in a real Chromium, then the network cut.
#
# Two triggers since 12 Nov 2026
# (docs/decisions/a-real-download-gates-download-prs.md):
#
#   * Every pull request that touches the download path — the map's
#     scripts, the service worker, the map app, the basemap settings or
#     this suite. It is a required check. The week it was weekly only, it
#     went red on Monday 9 Nov ("Download failed") and production broke
#     on the 12th anyway, because a red run blocked nothing. A PR that
#     cannot reach a download skips the job, which still reports a
#     (skipped) check and satisfies the ruleset, as e2e.yml does.
#   * The Monday cron, which keeps walking the fuzzed space of regions and
#     basemaps on main.
#
# The subject is fuzzed from the ISO week, so a PR and main in the same week
# test the same ground; tests/offline/test_martigny_verbier_downloads.py is
# fixed and runs every time. To reproduce a red run exactly, locally or via
# workflow_dispatch:
#
#     SNOWDESK_OFFLINE_SEED=2026-W37 uv run tox -e offline

name: Offline maps

on:
  schedule:
    # Mondays 05:00 UTC — ahead of the 06:00 security-audit cron so the two
    # do not contend for runners, and early enough that a red run is waiting
    # at the start of the week rather than discovered at the end of it.
    - cron: "0 5 * * 1"

  pull_request:
    types: [opened, synchronize, reopened]

  # Manual runs, with an optional seed. This is how a red weekly run is
  # reproduced without waiting a week, and how a fix is confirmed.
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed to reproduce (e.g. 2026-W37). Blank = this ISO week."
        required: false
        type: string

concurrency:
  # One run per ref; a new push to a PR replaces its run in flight.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect a download-path diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # "true" when this PR can change what a download does; the cron and
      # manual runs skip the filter and fall through to "true".
      downloads: ${{ steps.filter.outputs.downloads || 'true' }}
    steps:
      - name: Check the PR diff for download-path files
        id: filter
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail closed: an empty file list (API error) runs the suite.
          files="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')" || files=""
          downloads=false
          [ -n "$files" ] || downloads=true
          while IFS= read -r f; do
            case "$f" in
              static/js/*.js | static/js/bundles/* | apps/map/* \
                | apps/core/sw_shell.py \
                | apps/public/map_shared.py | apps/public/views.py \
                | apps/public/api.py | config/settings/base.py \
                | tests/offline/* | tox.ini | uv.lock | package-lock.json \
                | .github/workflows/offline-assurance.yml)
                downloads=true ;;
            esac
          done <<< "$files"
          echo "download-path filter -> downloads=$downloads"
          echo "downloads=$downloads" >> "$GITHUB_OUTPUT"

  offline:
    name: Offline maps assurance
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.downloads == 'true'
    # Generous: a fuzzed draw can pick a 220-tile region, and every tile is
    # a real request to a live origin. Well under the 6h default, so a hung
    # run still frees the runner in reasonable time.
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python (3.14)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Create .env
        run: |
          echo "SECRET_KEY=ci-offline-secret-key" > .env
          echo "DJANGO_SETTINGS_MODULE=config.settings.development" >> .env

      # Same reason as e2e.yml: the suite drives real pages, and
      # static/css/output.css is a gitignored build artefact. The tox env
      # builds it in commands_pre; Node is here so `npx @tailwindcss/cli`
      # resolves the pinned CLI from node_modules rather than downloading it.
      - name: Set up Node (22)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('uv.lock') }}

      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-offline-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-offline-

      - name: Run the offline assurance suite
        id: run
        env:
          SNOWDESK_OFFLINE_SEED: ${{ inputs.seed }}
        run: |
          pip install tox tox-uv
          tox -e offline

      # Runs whether the suite passed or failed: on a red run these are how
      # it gets diagnosed without a local repro, and on a green one the seed
      # is the record of what was actually covered that week.
      - name: Record the seed in the run summary
        if: always()
        env:
          SNOWDESK_OFFLINE_SEED: ${{ inputs.seed }}
        run: |
          seed="${SNOWDESK_OFFLINE_SEED:-$(date -u +%G-W%V)}"
          {
            echo "## Offline maps assurance"
            echo
            echo "Seed: \`${seed}\`"
            echo
            echo "Reproduce this exact run:"
            echo
            echo '```bash'
            echo "SNOWDESK_OFFLINE_SEED=${seed} uv run tox -e offline"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: offline-assurance-artefacts
          path: |
            test-results/
            logs/
          if-no-files-found: ignore
          retention-days: 30
