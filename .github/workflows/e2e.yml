# .github/workflows/e2e.yml — End-to-end browser tests (Playwright / Chromium).
#
# Runs the ``tox -e e2e`` env on every pull-request and push to main/release.
# Isolated from ci.yml so the Chromium install step and its cache are
# scoped to this workflow and do not bloat the main CI image.
#
# "Playwright smoke tests" is a required status check in the "Main branch
# rules" ruleset, so the ``pull_request`` trigger runs on every PR with no
# path filter — a path-filtered required check never reports on PRs outside
# its paths and leaves them stuck at "Expected" (SNOW-435). The ``push``
# trigger keeps a path filter: pushes to main/release are not merge-gated.
# Docs-only PRs skip the test job via the ``changes`` gate — a job-level
# skip still reports a (skipped) check run that satisfies the ruleset, so
# the SNOW-435 trap does not apply (SNOW-481).
#
# The Playwright binary cache is keyed on uv.lock so a new cache entry
# is created only when the Playwright package version changes.  Cache misses
# fall back to a clean install (the Chromium download takes ~60 s on a
# GitHub-hosted runner).

name: End-to-end (Playwright)

on:
  push:
    branches:
      - main
      - release
    paths:
      - "**/*.py"
      - "**/*.html"
      - "pyproject.toml"
      - "uv.lock"
      - "tox.ini"
      - ".github/workflows/e2e.yml"

  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: every job gets a read-only token unless it
# overrides this with a narrower/wider scope (SNOW-506).
permissions:
  contents: read

jobs:
  changes:
    name: Detect docs-only diff
    runs-on: ubuntu-latest
    # The docs-only filter lists PR files via the REST API, which needs
    # pull-requests:read on top of the default contents:read.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # "true" unless this is a docs-only pull request; push runs skip the
      # filter step and fall through to "true".
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - name: Check the PR diff for non-docs files
        id: filter
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail open: an empty file list (API error) runs the full suite.
          files="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')" || files=""
          code=false
          [ -n "$files" ] || code=true
          while IFS= read -r f; do
            case "$f" in
              "" | *.md | docs/* | .claude/*) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "docs-only filter -> code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python (3.14)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Create .env
        run: |
          echo "SECRET_KEY=ci-e2e-secret-key" > .env
          echo "DJANGO_SETTINGS_MODULE=config.settings.development" >> .env

      # The e2e tests drive the real page, so the Tailwind stylesheet must be
      # present — ``static/css/output.css`` is a gitignored build artefact, so
      # a fresh checkout has no CSS and any test that clicks a CSS-positioned
      # control (e.g. the map utility pills, which the map canvas would
      # otherwise occlude) fails its Playwright actionability check. Build it
      # here, mirroring lighthouse.yml, before the live server serves statics.
      - name: Set up Node (20)
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npx @tailwindcss/cli -i ./src/css/main.css -o ./static/css/output.css --minify

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('uv.lock') }}

      - name: Install tox and run e2e env
        run: |
          pip install tox
          tox -e e2e
