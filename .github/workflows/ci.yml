# .github/workflows/ci.yml — Run formatting, linting, type checks, Django
# checks, and tests via tox on push to main and on pull requests.
#
# The job contexts are required status checks in the "Main branch rules"
# ruleset, so the ``pull_request`` trigger runs on every PR with no path
# filter — a path-filtered required check never reports on PRs outside its
# paths and leaves them stuck at "Expected" (SNOW-435). The ``push``
# trigger keeps a path filter: pushes to main/release are not merge-gated.
#
# Docs-only PRs (every changed file is ``*.md``, ``docs/**``, or
# ``.claude/**``) skip the heavy jobs via the ``changes`` gate (SNOW-481).
# Unlike a workflow-level path filter, a job-level skip still reports a
# check run — with conclusion "skipped", which satisfies the ruleset — so
# this does not reintroduce the SNOW-435 "Expected" trap.

name: Python / Django

on:
  push:
    branches:
      - main
      - release
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - "tox.ini"
      - ".github/workflows/ci.yml"

  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: every job gets a read-only token unless it
# overrides this with a narrower/wider scope (SNOW-506).
permissions:
  contents: read

jobs:
  changes:
    name: Detect docs-only diff
    runs-on: ubuntu-latest
    # The docs-only filter lists PR files via the REST API, which needs
    # pull-requests:read on top of the default contents:read.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # "true" unless this is a docs-only pull request; push runs skip the
      # filter step and fall through to "true".
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - name: Check the PR diff for non-docs files
        id: filter
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail open: an empty file list (API error) runs the full suite.
          files="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')" || files=""
          code=false
          [ -n "$files" ] || code=true
          while IFS= read -r f; do
            case "$f" in
              "" | *.md | docs/* | .claude/*) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "docs-only filter -> code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  static:
    name: Static analysis
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        toxenv: [fmt, lint, mypy]
    env:
      TOXENV: ${{ matrix.toxenv }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python (3.14)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Create .env
        run: |
          echo "SECRET_KEY=ci-test-secret-key" > .env
          echo "DJANGO_SETTINGS_MODULE=config.settings.development" >> .env

      - name: Install and run tox
        run: |
          pip install tox
          tox

  checks:
    name: Run Django checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      TOXENV: django-checks

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python (3.14)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Create .env
        run: |
          echo "SECRET_KEY=ci-test-secret-key" > .env
          echo "DJANGO_SETTINGS_MODULE=config.settings.development" >> .env

      - name: Install and run tox
        run: |
          pip install tox
          tox

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      TOXENV: test

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python (3.14)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Create .env
        run: |
          echo "SECRET_KEY=ci-test-secret-key" > .env
          echo "DJANGO_SETTINGS_MODULE=config.settings.development" >> .env

      - name: Install and run tox
        run: |
          pip install tox
          tox
