# .github/workflows/lighthouse.yml — Run Lighthouse CI against the public
# site on pull requests. Asserts accessibility and SEO scores, warns on
# performance and best-practices regressions.
#
# "Audit public pages" is a required status check in the "Main branch
# rules" ruleset, so the ``pull_request`` trigger runs on every PR with no
# path filter — a path-filtered required check never reports on PRs outside
# its paths and leaves them stuck at "Expected" (SNOW-435).

name: Lighthouse

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Audit public pages
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python (3.14)
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Node (20)
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install Python dependencies
        run: uv sync

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npx @tailwindcss/cli -i ./src/css/main.css -o ./static/css/output.css --minify

      - name: Create .env
        run: |
          echo "SECRET_KEY=ci-test-secret-key" > .env
          echo "DJANGO_SETTINGS_MODULE=config.settings.development" >> .env
          echo "MAGIC_LINK_SECRET_KEY=ci-test-magic-link-secret" >> .env
          echo "MAGIC_LINK_BASE_URL=http://localhost:8000" >> .env
          echo "EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend" >> .env
          echo "DEFAULT_FROM_EMAIL=ci@example.com" >> .env

      - name: Run migrations
        run: uv run python manage.py migrate --noinput

      - name: Load fixtures
        run: uv run python manage.py loaddata test_data

      - name: Check query-count baseline (SNOW-13)
        run: uv run python manage.py monitor_query_counts

      - name: Collect static files (perf settings — ManifestStaticFilesStorage)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.perf
        run: uv run python manage.py collectstatic --noinput

      - name: Run Lighthouse CI
        env:
          DJANGO_SETTINGS_MODULE: config.settings.perf
        run: npx lhci autorun --collect.url=http://localhost:8765/CH-4115/martigny-verbier/2026-04-02/

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
