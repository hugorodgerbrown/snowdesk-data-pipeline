# .github/workflows/lighthouse.yml — Run Lighthouse CI against the public
# site on pull requests. Asserts accessibility and SEO scores, warns on
# performance and best-practices regressions.
#
# "Audit public pages" is a required status check in the "Main branch
# rules" ruleset, so the ``pull_request`` trigger runs on every PR with no
# path filter — a path-filtered required check never reports on PRs outside
# its paths and leaves them stuck at "Expected" (SNOW-435). Docs-only PRs
# skip the audit job via the ``changes`` gate — a job-level skip still
# reports a (skipped) check run that satisfies the ruleset, so the
# SNOW-435 trap does not apply (SNOW-481).
#
# This job is ``pull_request``-only by design and is deliberately NOT a
# required check on the "Release branch" ruleset. Advancing ``release`` is a
# fast-forward push (no PR), so this workflow never runs on the ``release``
# ref; requiring it there would leave every release stuck at "Expected" and
# force a bypass. The release commit is byte-identical to the ``main`` tip
# that already passed this audit as a PR — see docs/deployment.md
# ("Why a branch split"). Do not add this check to the Release-branch ruleset.

name: Lighthouse

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: every job gets a read-only token unless it
# overrides this with a narrower/wider scope (SNOW-506).
permissions:
  contents: read

jobs:
  changes:
    name: Detect docs-only diff
    runs-on: ubuntu-latest
    # The docs-only filter lists PR files via the REST API, which needs
    # pull-requests:read on top of the default contents:read.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # "true" unless this is a docs-only pull request.
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - name: Check the PR diff for non-docs files
        id: filter
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail open: an empty file list (API error) runs the full suite.
          files="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')" || files=""
          code=false
          [ -n "$files" ] || code=true
          while IFS= read -r f; do
            case "$f" in
              "" | *.md | docs/* | .claude/*) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "docs-only filter -> code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lighthouse:
    name: Audit public pages
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python (3.14)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Node (20)
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python dependencies
        run: uv sync

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npx @tailwindcss/cli -i ./src/css/main.css -o ./static/css/output.css --minify

      - name: Create .env
        run: |
          echo "SECRET_KEY=ci-test-secret-key" > .env
          echo "DJANGO_SETTINGS_MODULE=config.settings.development" >> .env
          echo "MAGIC_LINK_SECRET_KEY=ci-test-magic-link-secret" >> .env
          echo "MAGIC_LINK_BASE_URL=http://localhost:8000" >> .env
          echo "EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend" >> .env
          echo "DEFAULT_FROM_EMAIL=ci@example.com" >> .env

      - name: Run migrations
        run: uv run python manage.py migrate --noinput

      # Mirrors bin/build.sh: waffle_flags.json is the source of truth for
      # which flags exist, and every deploy reconciles the DB to it. Without
      # this step CI measures a database no deployed environment resembles —
      # a manifest flag is absent, so waffle pays one miss for it instead of
      # the three cold queries a real flag row costs, and the query-count
      # baseline drifts from the page's true cost (SNOW-690).
      - name: Sync waffle flags to the manifest
        run: uv run python manage.py sync_waffle_flags --commit

      - name: Seed the test dataset (factories)
        run: |
          uv run python manage.py loaddata eaws_CH resorts
          uv run python manage.py seed_test_data --all --commit

      - name: Check query-count baseline (SNOW-13)
        run: uv run python manage.py monitor_query_counts

      - name: Collect static files (perf settings — ManifestStaticFilesStorage)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.perf
        run: uv run python manage.py collectstatic --noinput

      - name: Run Lighthouse CI
        env:
          DJANGO_SETTINGS_MODULE: config.settings.perf
        run: npx lhci autorun --collect.url=http://localhost:8765/CH-4115/martigny-verbier/2026-04-02/

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
