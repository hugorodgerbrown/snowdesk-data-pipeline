# .github/dependabot.yml — Keep GitHub Actions and the uv-locked Python
# toolchain current (SNOW-506, SNOW-510).
#
# Third-party actions in .github/workflows/ are pinned to immutable commit
# SHAs (with a `# vX.Y.Z` comment recording the human-readable version) so a
# moved upstream tag cannot execute new code in CI unreviewed. Dependabot's
# github-actions ecosystem opens a PR when a newer release exists, updating
# both the SHA and the version comment — that is how the pins stay current
# without hand-maintenance.
#
# Every tox env now installs from uv.lock (SNOW-510, see
# docs/decisions/tox-envs-install-from-uv-lock.md), so uv.lock is the single
# place a stale Python tool/runtime pin can hide. Dependabot's `uv`
# ecosystem reads pyproject.toml/uv.lock and opens a PR bumping the lock —
# the npm ecosystem is still out of scope.
#
# uv patch and minor bumps are collapsed into one weekly grouped PR:
# dependabot-auto-merge.yml reads the group's highest semver bump, so a
# patch/minor-only group is classified minor and auto-merges once CI is
# green. Major bumps are excluded from the group and open one PR each, which
# auto-merge deliberately leaves for manual review (a major can pass CI yet
# change behaviour).

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One PR a week for all patch and minor bumps; majors are left out of
      # the group (and so open individually) to stay outside auto-merge.
      python-patch-minor:
        update-types:
          - "minor"
          - "patch"
