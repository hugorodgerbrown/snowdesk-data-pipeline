# .gitleaks.toml — gitleaks secret-detection configuration.
#
# The FIELD_ENCRYPTION_KEY value in .env.example and CI workflow files is an
# intentional dev/test fixture key (not a production secret).  Its purpose is
# documented in .env.example and the SNOW-285 decision doc.  The allowlist below
# prevents gitleaks from treating it as a leak.

[allowlist]
description = "Dev/test fixture FIELD_ENCRYPTION_KEY in .env.example and CI workflow files"
paths = [
    ".env.example",
    ".github/workflows/ci.yml",
    ".github/workflows/e2e.yml",
    ".github/workflows/lighthouse.yml",
]
