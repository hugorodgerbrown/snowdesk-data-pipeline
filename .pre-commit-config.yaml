repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Trailing tabs are significant in a TSV: stripping them drops the
        # empty trailing columns and reshapes the row. Leave data exports
        # byte-identical to what the spreadsheet produced.
        exclude: \.tsv$
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Local hooks pointing directly at the in-project venv's binaries.
  # Using `.venv/bin/<tool>` (rather than `uv run <tool>`) avoids
  # depending on PATH, so the hooks work identically from the CLI and
  # from GUI git clients like SublimeMerge that launch git with a
  # minimal environment and don't inherit the user's shell PATH.
  - repo: local
    hooks:
      - id: djangofmt
        name: djangofmt
        entry: .venv/bin/djangofmt
        language: system
        types_or: [html]
        # Scope matches tox.ini's [testenv:djangofmt] — the CI backstop only
        # formats the template directories, so without the docs/ exclude the
        # hook rewrites files nothing checks. The dated HTML artefacts under
        # docs/ (page-audits, research) are standalone documents, not Django
        # templates: they carry no template tags, and djangofmt reflows their
        # hand-aligned token tables and comment banners into noise.
        exclude: ^docs/|_bulletin_panel\.html$

      - id: mypy
        name: mypy
        # Target list MUST match tox.ini's [testenv:mypy] command exactly, so a
        # local commit can't pass while CI mypy fails on a package the hook
        # skipped (SNOW-512).
        entry: .venv/bin/mypy apps/core/ apps/bulletins/ apps/regions/ apps/public/ apps/accounts/ apps/analytics/ tests/ config/ apps/observations/ apps/favourites/ apps/mcp_server/ schedule.py
        language: system
        types: [python]
        pass_filenames: false
