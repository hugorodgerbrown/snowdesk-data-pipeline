repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Trailing tabs are significant in a TSV: stripping them drops the
        # empty trailing columns and reshapes the row. Leave data exports
        # byte-identical to what the spreadsheet produced.
        exclude: \.tsv$
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Local hooks pointing directly at the in-project venv's binaries.
  # Using `.venv/bin/<tool>` (rather than `uv run <tool>`) avoids
  # depending on PATH, so the hooks work identically from the CLI and
  # from GUI git clients like SublimeMerge that launch git with a
  # minimal environment and don't inherit the user's shell PATH.
  - repo: local
    hooks:
      - id: djangofmt
        name: djangofmt
        entry: .venv/bin/djangofmt
        language: system
        types_or: [html]
        # Scope matches tox.ini's [testenv:djangofmt] — the CI backstop only
        # formats the template directories, so without the docs/ exclude the
        # hook rewrites files nothing checks. The dated HTML artefacts under
        # docs/ (page-audits, research) are standalone documents, not Django
        # templates: they carry no template tags, and djangofmt reflows their
        # hand-aligned token tables and comment banners into noise.
        exclude: ^docs/|_bulletin_panel\.html$

      - id: mypy
        name: mypy
        # Target list MUST match tox.ini's [testenv:mypy] command exactly, so a
        # local commit can't pass while CI mypy fails on a package the hook
        # skipped (SNOW-512).
        entry: .venv/bin/mypy apps/core/ apps/bulletins/ apps/regions/ apps/public/ apps/accounts/ apps/analytics/ tests/ config/ apps/observations/ apps/favourites/ apps/mcp_server/ schedule.py
        language: system
        types: [python]
        pass_filenames: false

      # SNOW-858. The five bespoke lint guards below existed only as tox envs
      # and CI matrix legs, so a token violation or a hardcoded JS string was
      # reported minutes later, in a CI log, on a branch already pushed. They
      # are cheap (~80–240ms each) and dependency-free — stdlib python3, no
      # Django — so they belong here, on the same "local hook for speed, tox
      # env as the CI backstop" design djangofmt already follows. Nothing in
      # tox.ini or lint-guards.yml changed: the backstop is what makes a
      # bypassable hook safe.
      #
      # `files:` scoping is not cosmetic. Each guard applies its own root
      # allowlist to its directory walk but NOT to explicitly-named paths, so
      # an unscoped hook would lint files the full-tree CI run never visits
      # (e.g. apps/locations/templates/) and disagree with CI. And because all
      # four default to a whole-tree scan when given no paths, a hook must
      # never be handed an empty file list — pre-commit guarantees that by
      # skipping a hook whose filter matches nothing.
      - id: ds-lint
        name: ds-lint
        entry: .venv/bin/python bin/ds-lint
        language: system
        types_or: [html, javascript]
        # Mirrors bin/ds-lint's own TEMPLATE_ROOTS + JS_ROOTS.
        files: ^(templates/|apps/(public|accounts|bulletins|weather|observations|favourites|routes|trips)/templates/|static/js/)
        # The vendored bundles, matching bin/ds-lint's PATH_ALLOWLIST. Named
        # individually rather than by a `*.min.js` glob so vendoring a new
        # file is a deliberate act that shows up in review.
        exclude: ^static/js/(htmx|maplibre-gl)\.min\.js$

      - id: i18n-lint
        name: i18n-lint
        entry: .venv/bin/python bin/i18n-lint
        language: system
        types: [javascript]
        files: ^static/js/

      - id: js-globals-lint
        name: js-globals-lint
        entry: .venv/bin/python bin/js-globals-lint
        language: system
        types: [javascript]
        files: ^static/js/
        # `pass_filenames: false` is LOAD-BEARING — do not "optimise" this
        # into a per-file run. The guard collects the set of assigned globals
        # across the whole file set on argv, which is the entire point of the
        # window.pwa* convention: handed one file, every global another module
        # publishes reads as unknown. On the current clean tree 50 of 89 files
        # exit 1 when linted alone (map.js alone yields 74 false findings).
        # Running bare makes it a whole-tree scan, triggered whenever a staged
        # JS file matches — the same mechanism, and the same reasoning, as the
        # mypy hook above.
        pass_filenames: false

      - id: docs-lint
        name: docs-lint
        entry: .venv/bin/python bin/docs-lint
        language: system
        types: [markdown]
        files: ^docs/

      - id: migrations-lint
        name: migrations-lint
        entry: .venv/bin/python bin/migrations-lint
        language: system
        types: [python]
        # Only a migration can create a collision, so the guard is worth its
        # 77ms only when one is staged. The regex mirrors the tree the script
        # walks: every apps/*/migrations/ directory.
        files: ^apps/[^/]+/migrations/.*\.py$
        # Whole-graph by construction — it takes no paths, only --show-leaves,
        # because a duplicate number and a split migration graph are both
        # properties of the SET of migrations, invisible in any one file.
        pass_filenames: false
