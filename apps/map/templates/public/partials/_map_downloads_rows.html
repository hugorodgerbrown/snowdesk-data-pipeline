panel's scroll region: the group container, the group `<template>` and

includes/_ugc_panel.html's `rows_template` slot.

SNOW-645 split the list under two FIXED headings — REGIONS, then CUSTOM
AREAS — both rendered here unconditionally and hidden by render() when
empty. SNOW-832 (Hugo's handoff) groups by BASEMAP instead, and the two
fixed wrappers cannot survive that: which basemaps a device holds is
data, not markup. So there is one `<template>` here, rendered from
includes/_ugc_panel_group.html, and map_downloads_manager.js's render()
clones it once per group that actually has rows — which is also why no
group needs a `hidden` state any more. A group heading now carries that
basemap's own identity colour, and the KIND moved down into each row's
own meta line ("Region · 5.1 MB").

Within a group the order is manageRows' own — regions before custom
areas, alphabetical within each (SNOW-832 replaced largest-first: the
list is scanned for a name now, not judged by a number).

Group heading style is the shared partial's; the mono uppercase label
inside it is still includes/_eyebrow.html, so all the section labels
across the four panels come from one place.
