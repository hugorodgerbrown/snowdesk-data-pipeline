{% load i18n static components %}
{% comment %}
public/partials/_favourites_surface.html — Favourite-pin sheet + JS (SNOW-414).

Mirrors _report_surface.html's structure: a viewport-anchored sheet
container that favourites.js opens/closes, plus a couple of server-rendered
<template>s the JS clones rather than fetching from the server — there is
no "fetch one favourite" GET endpoint (SNOW-413 only shipped POST create /
rename / delete + the geojson layer), so the create form and the CSRF token
it carries are rendered once, here, and reused by the JS for both the
create flow and the pin-detail (rename/delete) flow.

Three shared modules are loaded once each by home.html (shared with
_report_surface.html) before this partial — none is repeated here:

  htmx.min.js       used by the report surface's HTMX-swapped form.
  place_picker.js   favourites.js drives window.PlacePicker. Both partials
                    used to carry their own tag, which loaded the file
                    twice on one page and left the second IIFE's
                    window.PlacePicker overwriting the first (C5,
                    2026-08-03 JS review).
  map_sheet.js      the sheet controller, failure toast and
                    mutation-storage guard this surface shares with
                    _report_surface.html (SNOW-608).

Context expected:
  favourite_create_url        — str: POST endpoint for favourites:create.
  favourites_signin_url       — str: sign-in page URL for the anon CTA.
{% endcomment %}
{# Sheet container — hidden until favourites.js opens it. SNOW-486:    #}
{# delegated to the shared sheet primitive (includes/_overlay_sheet.html) — #}
{# same shape as #report-sheet so the two surfaces read as one family. #}
{% trans "Favourite" as favourite_sheet_aria_label %}
{% include "includes/_overlay_sheet.html" with id="favourite-sheet" aria_label=favourite_sheet_aria_label %}
{# SNOW-658: the panel the roundel now opens — the user's saved pins, a     #}
{# CTA to add another, and the map-overlay switch that used to be a row in  #}
{# the layers menu. Cloned by favourites.js on every open (so a stale row   #}
{# can never survive a re-open), which then loads the rows themselves over  #}
{# HTMX from favourites:list — the SAME endpoint and the same partials the  #}
{# manage page uses, so each row arrives with its rename/delete wiring       #}
{# already attached and this file needs no copy of it.                       #}
{#                                                                           #}
{# Adding a pin is an action INSIDE the panel now ([data-favourites-add]),   #}
{# not the roundel's own click — the shape SNOW-634 set for downloads, and   #}
{# the reason the roundel's aria-label says "manage" rather than "add".      #}
{#                                                                           #}
{# The rows container starts with a loading line rather than empty: the      #}
{# request can fail (this panel is reachable offline, its list is not), and  #}
{# an empty container would read as "you have no favourites" — a wrong       #}
{# statement about the user's own data. favourites.js swaps in a distinct    #}
{# error line on htmx:responseError / htmx:sendError for that target.        #}
<template id="favourite-list-template">
    <div class="flex flex-col gap-3 px-2 py-4">
        {% trans "Favourites" as favourite_list_title %}
        {% include "includes/_sheet_header.html" with title=favourite_list_title close_action="dismiss" %}
        <div data-favourites-rows class="flex flex-col gap-2">
            <p class="text-sm text-text-2">{% trans "Loading your favourites…" %}</p>
        </div>
        <button
            type="button"
            data-favourites-add
            class='{% button_classes variant="secondary" size="compact" full_width=True %} inline-flex items-center justify-center gap-1.5'
        >
            <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
            >
                <path d="M12 5v14M5 12h14" />
            </svg>
            {% trans "Add a favourite" %}
        </button>
        {% trans "Show favourites on the map" as favourites_overlay_toggle_label %}
        {% include "includes/_map_overlay_toggle.html" with id="map-favourites-overlay-toggle" label=favourites_overlay_toggle_label %}
    </div>
</template>
{# Create-form template — cloned by favourites.js once a pin has been  #}
{# placed/dragged into position. Carries a real {% csrf_token %} — the  #}
{# submit is intercepted by favourites.js and routed through the client #}
{# mutation queue (SNOW-479), NOT htmx, so an offline save is captured  #}
{# and replayed on reconnect; the CSRF token rides in the urlencoded    #}
{# body. lat/lon are written into the hidden inputs by favourites.js    #}
{# before the form is shown. ``action`` is a degraded no-JS target      #}
{# only (the endpoint is @require_htmx, so a native submit 400s).       #}
<template id="favourite-create-template">
    <form
        id="favourite-create-form"
        method="post"
        action="{{ favourite_create_url }}"
        class="flex flex-col gap-3 px-2 py-4"
    >
        {% trans "Add favourite" as favourite_create_title %}
        {% include "includes/_sheet_header.html" with title=favourite_create_title close_action="dismiss" %}
        {% csrf_token %}
        <input type="hidden" name="lat">
        <input type="hidden" name="lon">
        <label class="text-sm text-text-2" for="favourite-name-input">
            {% trans "Name this pin (optional)" %}
        </label>
        <input
            id="favourite-name-input"
            type="text"
            name="name"
            maxlength="100"
            placeholder='{% trans "Unnamed pin" %}'
            class="w-full rounded-tag border border-border bg-card px-3 py-2 text-sm text-text-1 placeholder:text-text-3 focus:outline-none"
        >
        <div class="flex items-center gap-3">
            <button
                type="submit"
                class="flex-1 rounded-pill bg-status-info-bg py-2 text-sm font-medium text-status-info-text"
            >
                {% trans "Save" %}
            </button>
            <button
                type="button"
                data-action="dismiss"
                class="flex-1 rounded-pill border border-border py-2 text-sm font-medium text-text-2"
            >
                {% trans "Cancel" %}
            </button>
        </div>
    </form>
</template>
{# Optimistic-confirmation template (SNOW-479) — cloned into            #}
{# #favourite-sheet by favourites.js the instant a create is enqueued  #}
{# on the mutation queue, before the queued mutation has replayed.      #}
{# favourites.js reveals the [data-favourite-pending] line only when    #}
{# the tap happened offline; online, the pin round-trips near-instantly #}
{# so the "will sync" reassurance would be misleading. Mirrors          #}
{# observations/partials/_report_confirmation.html.                     #}
<template id="favourite-confirmation-template">
    <div class="flex flex-col items-center gap-4 py-4 text-center">
        <div class="text-4xl text-status-low-text" aria-hidden="true">✓</div>
        <p class="text-base font-medium text-text-1">{% trans "Pin saved!" %}</p>
        <p class="text-sm text-text-2">
            {% trans "Your favourite has been saved to this device." %}
        </p>
        {# Hidden by default; favourites.js reveals this on the optimistic #}
        {# clone only when the tap happened offline.                       #}
        <p data-favourite-pending hidden class="text-sm text-text-2">
            {% trans "Saved — will sync when you're back online." %}
        </p>
        <button
            type="button"
            data-action="dismiss"
            class="rounded-tag border border-text-3/30 px-4 py-2 text-sm font-medium text-text-2 transition-colors hover:border-text-2 hover:text-text-1"
        >
            {% trans "Close" %}
        </button>
    </div>
</template>
{# SNOW-475: place_picker.js is loaded by home.html (shared with        #}
{# _report_surface.html) — not repeated here; see this partial's header #}
{# comment.                                                             #}
{# SNOW-414: saved-pin add/rename/delete JS. #}
<script defer src="{% static 'js/favourites.js' %}"></script>
{# SNOW-620: favourites.js builds its whole sheet through DOM APIs — the     #}
{# pin-detail row and the anonymous sign-in CTA have no server partial — so  #}
{# this copy never passed through a template and makemessages could not see  #}
{# it. Read back via window.pwaStrings.read(); the module keeps the English  #}
{# literal as the fallback. See static/js/i18n_strings.js.                   #}
<template id="favourites-strings-template">
    {# SNOW-658: "sheet-title" / "close" lived here for favourites.js's own    #}
    {# DOM-built sheet header. Every state the module renders now clones a     #}
    {# template that includes the real includes/_sheet_header.html, so both    #}
    {# strings went with that copy.                                            #}
    <span data-string="signin-prompt">{% trans "Sign in to save a favourite." %}</span>
    <span data-string="signin-cta">{% trans "Sign in" %}</span>
    <span data-string="unnamed-pin">{% trans "Unnamed pin" %}</span>
    <span data-string="name-label">{% trans "Favourite name" %}</span>
    <span data-string="remove">{% trans "Remove" %}</span>
    {# SNOW-658: the panel's own failure line. Distinct from the empty state  #}
    {# favourites:list renders ("You have no saved favourites yet.") on       #}
    {# purpose: this panel opens offline, its list does not load offline, and #}
    {# telling a user they have no pins when the request merely failed is a   #}
    {# wrong statement about their own data.                                  #}
    <span data-string="list-failed">{% trans "Your favourites couldn't be loaded — check your connection." %}</span>
</template>
